<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | My Requests</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><style>.wrap{max-width:1050px;margin:36px auto;padding:20px}.cardx{background:#fff;border:1px solid #e6eaf1;border-radius:18px;padding:20px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #edf0f5;text-align:left}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:#fff4e4;color:#a85a00}.approved{background:#e8f8f0;color:#137a4a}.rejected{background:#ffeded;color:#a52020}.empty{padding:32px;text-align:center;color:#728096}@media(max-width:760px){.table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><nav class="navlinks"><a href="dashboard.html">Dashboard</a><a href="marketplace.html">Marketplace</a><a href="listing-plans.html">Republish Plans</a></nav></div></header><main class="wrap"><h1>My Purchase Requests</h1><p>Track Promote and Republish plan requests.</p><div class="cardx" id="box"><div class="empty">Loading…</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=b=>(Number(b||0)/1000).toFixed(3)+' OMR';async function load(){const u=await BingoAuth.getUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const {data,error}=await sb.rpc('my_manual_purchase_orders');const box=document.getElementById('box');if(error){box.innerHTML='<div class="empty">Run the manual packages SQL migration first.</div>';return}if(!data?.length){box.innerHTML='<div class="empty">No purchase requests yet.</div>';return}box.innerHTML='<table class="table"><thead><tr><th>Date</th><th>Package</th><th>Listing</th><th>Amount</th><th>Status</th><th>Admin note</th></tr></thead><tbody>'+data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.package_code)}</td><td>${esc(x.listing_title||'Account plan')}</td><td>${money(x.amount_baisa)}</td><td><span class="badge ${x.status}">${esc(x.status)}</span></td><td>${esc(x.admin_note||'—')}</td></tr>`).join('')+'</tbody></table>'}load();
</script></body></html>
