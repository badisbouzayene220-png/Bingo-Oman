<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Product</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><style>
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:35px;padding:35px 0}.photo{min-height:430px;background:#f2f4f8;border-radius:24px;overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;max-height:520px;object-fit:cover}.info h1{font-size:38px;margin:8px 0}.price{font-size:30px;font-weight:900;color:#092a82;margin:20px 0}.desc{color:#697589;line-height:1.8}.buybox{margin-top:25px;padding:20px;border:1px solid #e1e6ee;border-radius:18px}.qty{display:flex;gap:8px;align-items:center}.qty input{width:90px;padding:12px;border:1px solid #ccd5e2;border-radius:10px}.buybox button{margin-top:12px;width:100%}.notice{margin-top:12px}@media(max-width:800px){.detail{grid-template-columns:1fr}.photo{min-height:300px}.info h1{font-size:30px}}
</style><link rel="stylesheet" href="characters.css">
<link rel="stylesheet" href="global-banner.css">
</head><body><header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a class="active" href="store.html">Store</a><a href="orders.html">My Orders</a></nav><div class="actions"><button class="btn primary small bingo-cart-trigger" type="button">🛒 <span data-i18n="cart_label">Cart</span> <span id="cartCount">0</span></button><a href="store.html">Store</a></div></div></header><main class="pagebody"><div class="container"><div id="view">Loading…</div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');
function cart(){return JSON.parse(localStorage.getItem('bingo_cart')||'[]')}function save(c){localStorage.setItem('bingo_cart',JSON.stringify(c))}
async function load(){if(!id){$('view').innerHTML='<h2>Product not found</h2>';return}const {data:p,error}=await sb.from('store_products').select('*').eq('id',id).eq('is_active',true).maybeSingle();if(error||!p){$('view').innerHTML='<div class="empty"><h2>Product not found</h2><a class="btn primary" href="store.html">Back to store</a></div>';return}const img=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:'<span style="font-size:90px">🛍️</span>';$('view').innerHTML=`<div class="detail"><div class="photo">${img}</div><div class="info"><div class="kicker">${esc(p.category||'STORE')}</div><h1>${esc(p.title)}</h1><div class="price">${Number(p.price).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><p class="desc">${esc(p.description||'No description available.')}</p><div class="buybox"><div><b>${p.stock>0?`${p.stock} available`:'Out of stock'}</b></div><div class="qty"><label>Quantity</label><input id="qty" type="number" min="1" max="${Math.max(p.stock,1)}" value="1" ${p.stock<1?'disabled':''}></div><button class="btn primary" ${p.stock<1?'disabled':''} onclick="add()">Add to cart</button><div id="msg"></div></div><a href="store.html" style="display:inline-block;margin-top:15px">← Back to store</a></div></div>`;window.product=p}
window.add=()=>{const p=window.product,q=Math.max(1,Number($('qty').value||1));if(window.BingoCart){window.BingoCart.add({product_id:p.id,title:p.title,price:Number(p.price),image_url:p.image_url,quantity:Math.min(q,p.stock)});}else{const c=cart(),x=c.find(i=>i.product_id===p.id);if(x)x.quantity=Math.min(x.quantity+q,p.stock);else c.push({product_id:p.id,title:p.title,price:Number(p.price),image_url:p.image_url,quantity:Math.min(q,p.stock)});save(c)}$('msg').innerHTML='<div class="notice ok">'+((window.BingoLang&&window.BingoLang.get&&window.BingoLang.get()==="ar")?'تمت الإضافة إلى السلة.':'Added to cart.')+' <a href="checkout.html">'+((window.BingoLang&&window.BingoLang.get&&window.BingoLang.get()==="ar")?'الانتقال إلى إتمام الطلب':'Go to checkout')+'</a></div>';};load();
</script><script src="language.js"></script><script src="cart.js"></script><script src="characters.js"></script>
</body></html>
