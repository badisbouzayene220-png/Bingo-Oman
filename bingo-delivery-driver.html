<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Driver</title><link rel="stylesheet" href="bingo-delivery.css?v=driver-login-v2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=driver-login-v2"></script><script src="supabase-client.js?v=driver-login-v2"></script><style>.driver-login{max-width:440px;margin:40px auto}.driver-login form{display:grid;gap:12px}.driver-login input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.driver-login label{display:grid;gap:6px;font-weight:600}.driver-hidden{display:none!important}.driver-userbar{display:flex;align-items:center;gap:8px}.driver-error{padding:12px;border-radius:10px;background:#fff1f1;color:#a00}.driver-success{padding:12px;border-radius:10px;background:#effaf1;color:#176b2c}</style></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Driver<small>المندوب</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html">العميل</a><a href="bingo-delivery-seller.html">البائع</a><a href="bingo-delivery-admin.html">إدارة التوصيل</a><a href="#" data-bd-language>EN</a><span id="driver-user" class="driver-userbar"></span><button id="driver-logout" class="bd-btn ghost driver-hidden" type="button">خروج</button></nav></header><main class="bd-main"><section id="driver-login" class="bd-card driver-login"><h2>دخول المندوب</h2><p class="bd-muted">سجّل الدخول بحساب المندوب للوصول إلى التوصيلات.</p><form id="driver-login-form"><label>البريد الإلكتروني<input id="driver-email" type="email" autocomplete="username" required value="delivery.driver@test.com"></label><label>كلمة المرور<input id="driver-password" type="password" autocomplete="current-password" required></label><button class="bd-btn orange" type="submit">تسجيل الدخول</button><div id="driver-login-message" role="alert"></div></form></section><section id="driver-app" class="driver-hidden"><section class="bd-card"><div class="bd-actions"><button id="driver-online" class="bd-btn primary" type="button">ONLINE</button><span id="driver-online-badge" class="bd-badge warning">غير متصل</span></div><p id="driver-message" role="status"></p></section><section class="bd-card" style="margin-top:18px"><h2>طلب جديد</h2><div id="driver-orders"><p>جاري تحميل الطلبات...</p></div></section><section class="bd-card" style="margin-top:18px"><h2>التوصيلات النشطة</h2><div id="active-deliveries"><p>لا توجد توصيلات نشطة</p></div></section><div class="bd-grid cards" style="margin-top:18px"><section class="bd-card"><div class="bd-muted">اليوم</div><div id="driver-today" class="bd-stat">0.000 OMR</div></section><section class="bd-card"><div class="bd-muted">هذا الأسبوع</div><div id="driver-week" class="bd-stat">0.000 OMR</div></section></div></section></main><script src="bingo-delivery.js?v=driver-login-v2"></script><script>
(function(){'use strict';
const sb=window.sb;
const DRIVER_EMAIL='delivery.driver@test.com';
const loginEl=document.getElementById('driver-login'),appEl=document.getElementById('driver-app'),userEl=document.getElementById('driver-user'),msg=document.getElementById('driver-message'),loginMsg=document.getElementById('driver-login-message'),logoutBtn=document.getElementById('driver-logout'),onlineBtn=document.getElementById('driver-online'),badge=document.getElementById('driver-online-badge');
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function showLogin(){loginEl.classList.remove('driver-hidden');appEl.classList.add('driver-hidden');logoutBtn.classList.add('driver-hidden');userEl.textContent='';}
function showApp(email){loginEl.classList.add('driver-hidden');appEl.classList.remove('driver-hidden');logoutBtn.classList.remove('driver-hidden');userEl.textContent=email||'';}
async function ensureDriver(online){const r=await sb.rpc('delivery_set_driver_status',{p_online:online});if(r.error)throw r.error;return r.data;}
async function load(){const r=await sb.auth.getUser();if(r.error)throw r.error;const user=r.data.user;if(!user){showLogin();return;}if((user.email||'').toLowerCase()!==DRIVER_EMAIL){await sb.auth.signOut();loginMsg.innerHTML='<span class="driver-error">هذا الحساب ليس حساب المندوب. استخدم '+DRIVER_EMAIL+'</span>';showLogin();return;}showApp(user.email);let d=await sb.from('delivery_drivers').select('id,is_online,is_available').eq('id',user.id).maybeSingle();if(d.error)throw d.error;if(!d.data){try{await ensureDriver(true)}catch(e){msg.textContent='تعذر إنشاء ملف المندوب: '+(e.message||e);}}d=await sb.from('delivery_drivers').select('id,is_online,is_available').eq('id',user.id).maybeSingle();if(d.error)throw d.error;const on=!!d.data?.is_online;onlineBtn.textContent=on?'OFFLINE':'ONLINE';badge.textContent=on?'متصل':'غير متصل';badge.className='bd-badge '+(on?'success':'warning');const q=await sb.from('delivery_assignments').select('id,status,order_id,driver_id,offered_at,delivery_orders(id,order_number,status,total,delivery_fee,delivery_address,distance_km)').eq('driver_id',user.id).in('status',['offered','accepted','picked_up','on_delivery']).order('offered_at',{ascending:false});if(q.error)throw q.error;const rows=q.data||[],offered=rows.filter(a=>a.status==='offered'),active=rows.filter(a=>['accepted','picked_up','on_delivery'].includes(a.status));document.getElementById('driver-orders').innerHTML=offered.length?offered.map(a=>{const o=a.delivery_orders||{};return `<article class="delivery-order-card"><strong>${esc(o.order_number||a.order_id)}</strong><span>${Number(o.distance_km||0).toFixed(2)} km</span><span>${Number(o.delivery_fee||0).toFixed(3)} OMR</span><small>${esc(o.delivery_address||'')}</small><div class="bd-actions"><button class="bd-btn primary" data-action="accept" data-id="${a.id}">قبول</button><button class="bd-btn ghost" data-action="reject" data-id="${a.id}">رفض</button></div></article>`}).join(''):'<p>لا توجد طلبات جديدة</p>';document.getElementById('active-deliveries').innerHTML=active.length?active.map(a=>{const o=a.delivery_orders||{};let b='';if(a.status==='accepted')b=`<button class="bd-btn orange" data-action="pickup" data-id="${a.id}">استلام</button>`;else if(a.status==='picked_up'||a.status==='on_delivery')b=`<button class="bd-btn primary" data-action="delivered" data-id="${a.id}">تم التسليم</button>`;return `<article class="delivery-order-card"><strong>${esc(o.order_number||a.order_id)}</strong><span>${esc(a.status)}</span><span>${Number(o.delivery_fee||0).toFixed(3)} OMR</span><small>${esc(o.delivery_address||'')}</small><div class="bd-actions">${b}</div></article>`}).join(''):'<p>لا توجد توصيلات نشطة</p>';}
async function login(e){e.preventDefault();loginMsg.textContent='جاري تسجيل الدخول...';const email=document.getElementById('driver-email').value.trim(),password=document.getElementById('driver-password').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error){loginMsg.innerHTML='<span class="driver-error">فشل تسجيل الدخول: '+esc(r.error.message)+'</span>';return;}document.getElementById('driver-password').value='';await load();}
logoutBtn.onclick=async()=>{await sb.auth.signOut();showLogin();};onlineBtn.onclick=async()=>{try{const r=await sb.auth.getUser();if(!r.data.user){showLogin();return;}const goOnline=onlineBtn.textContent==='ONLINE';await ensureDriver(goOnline);await load();}catch(e){msg.textContent=e.message||'فشل تحديث الحالة';}};
document.getElementById('driver-login-form').addEventListener('submit',login);document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{if(b.dataset.action==='accept')await BingoDelivery.decideAssignment(b.dataset.id,true);else if(b.dataset.action==='reject')await BingoDelivery.decideAssignment(b.dataset.id,false);else if(b.dataset.action==='pickup')await BingoDelivery.setAssignmentStatus(b.dataset.id,'picked_up');else if(b.dataset.action==='delivered')await BingoDelivery.setAssignmentStatus(b.dataset.id,'delivered');msg.textContent='تم تحديث الطلب بنجاح';await load();}catch(err){msg.textContent=err.message||'تعذر تحديث الطلب';}});
async function boot(){if(!sb?.auth){loginMsg.innerHTML='<span class="driver-error">Supabase لم يتم تحميله.</span>';return;}await load().catch(e=>{console.error(e);showLogin();loginMsg.textContent=e.message||'تعذر تحميل صفحة المندوب';});sb.auth.onAuthStateChange(()=>setTimeout(()=>load().catch(console.error),0));setInterval(()=>{if(!appEl.classList.contains('driver-hidden'))load().catch(console.error)},15000)}boot();})();
</script></body></html>
