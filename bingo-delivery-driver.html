<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Driver</title><link rel="stylesheet" href="bingo-delivery.css"></head>
<body>
<header class="bd-topbar"><div class="bd-brand">BINGO Driver<small data-bd-i18n="driver">المندوب</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html" data-bd-i18n="customer">العميل</a><a href="bingo-delivery-seller.html" data-bd-i18n="seller">البائع</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="javascript:BingoDelivery.setLang(BingoDelivery.getLang()==='ar'?'en':'ar')" data-bd-language>EN</a></nav></header>
<main class="bd-main">
<section class="bd-card"><div class="bd-actions"><button id="driver-online" class="bd-btn primary">ONLINE</button><span id="driver-online-badge" class="bd-badge success">متصل</span></div><p id="driver-message" role="status"></p></section>
<section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="newOrder">طلب جديد</h2><div id="driver-orders"><p>جاري تحميل الطلبات...</p></div></section>
<section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="activeDeliveries">التوصيلات النشطة</h2><div id="active-deliveries"><p>لا توجد توصيلات نشطة</p></div></section>
<div class="bd-grid cards" style="margin-top:18px"><section class="bd-card"><div class="bd-muted" data-bd-i18n="today">اليوم</div><div id="driver-today" class="bd-stat">0.000 OMR</div></section><section class="bd-card"><div class="bd-muted" data-bd-i18n="thisWeek">هذا الأسبوع</div><div id="driver-week" class="bd-stat">0.000 OMR</div></section></div>
</main>
<script src="bingo-delivery.js"></script>
<script>
(function(){
 const wait=()=>{if(!window.BingoDelivery||!window.supabaseClient)return setTimeout(wait,100);init()};
 async function init(){
  const sb=window.supabaseClient; await BingoDelivery.renderAuth();
  const msg=document.getElementById('driver-message'), onlineBtn=document.getElementById('driver-online'), badge=document.getElementById('driver-online-badge');
  const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  async function load(){
   const {data:sessionData}=await sb.auth.getSession(); if(!sessionData?.session){document.getElementById('driver-orders').innerHTML='<p>يرجى تسجيل الدخول</p>';return}
   const {data,error}=await sb.from('delivery_assignments').select('id,status,order_id,driver_id,offered_at,delivery_orders(id,order_number,status,total,delivery_fee,delivery_address,distance_km)').in('status',['offered','accepted','picked_up','on_delivery']).order('offered_at',{ascending:false});
   if(error){document.getElementById('driver-orders').innerHTML='<p>'+esc(error.message)+'</p>';return}
   const rows=data||[], offered=rows.filter(a=>a.status==='offered'), active=rows.filter(a=>['accepted','picked_up','on_delivery'].includes(a.status));
   document.getElementById('driver-orders').innerHTML=offered.length?offered.map(a=>{const o=a.delivery_orders||{};return `<article class="delivery-order-card"><strong>${esc(o.order_number||a.order_id)}</strong><span>${Number(o.distance_km||0).toFixed(2)} km</span><span>${Number(o.delivery_fee||0).toFixed(3)} OMR</span><small>${esc(o.delivery_address||'')}</small><div class="bd-actions"><button class="bd-btn primary" data-action="accept" data-id="${a.id}">قبول</button><button class="bd-btn ghost" data-action="reject" data-id="${a.id}">رفض</button></div></article>`}).join(''):'<p>لا توجد طلبات جديدة</p>';
   document.getElementById('active-deliveries').innerHTML=active.length?active.map(a=>{const o=a.delivery_orders||{};let b='';if(a.status==='accepted')b=`<button class="bd-btn orange" data-action="pickup" data-id="${a.id}">استلام</button>`;else if(a.status==='picked_up'||a.status==='on_delivery')b=`<button class="bd-btn primary" data-action="delivered" data-id="${a.id}">تم التسليم</button>`;return `<article class="delivery-order-card"><strong>${esc(o.order_number||a.order_id)}</strong><span>${esc(a.status)}</span><span>${Number(o.delivery_fee||0).toFixed(3)} OMR</span><small>${esc(o.delivery_address||'')}</small><div class="bd-actions">${b}</div></article>`}).join(''):'<p>لا توجد توصيلات نشطة</p>';
   const {data:driver}=await sb.from('delivery_drivers').select('is_online,is_available').eq('user_id',sessionData.session.user.id).maybeSingle();const on=!!driver?.is_online;onlineBtn.textContent=on?'OFFLINE':'ONLINE';badge.textContent=on?'متصل':'غير متصل';
  }
  onlineBtn.onclick=async()=>{try{const {data:s}=await sb.auth.getSession();if(!s?.session)throw new Error('يرجى تسجيل الدخول أولاً');await BingoDelivery.setDriverStatus(onlineBtn.textContent==='ONLINE');await load()}catch(e){msg.textContent=e.message||'فشل تحديث الحالة'}};
  document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;try{if(b.dataset.action==='accept')await BingoDelivery.decideAssignment(b.dataset.id,true);else if(b.dataset.action==='reject')await BingoDelivery.decideAssignment(b.dataset.id,false);else if(b.dataset.action==='pickup')await BingoDelivery.setAssignmentStatus(b.dataset.id,'picked_up');else if(b.dataset.action==='delivered')await BingoDelivery.setAssignmentStatus(b.dataset.id,'delivered');msg.textContent='تم تحديث الطلب بنجاح';await load()}catch(err){msg.textContent=err.message||'تعذر تحديث الطلب'}});
  await load();setInterval(load,15000);
 }
 wait();
})();
</script>
</body></html>
