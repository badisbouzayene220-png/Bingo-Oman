<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Driver</title><link rel="stylesheet" href="bingo-delivery.css?v=driver-v3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=driver-v3"></script><script src="supabase-client.js?v=driver-v3"></script></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Driver<small>المندوب</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html">العميل</a><a href="bingo-delivery-seller.html">البائع</a><a href="bingo-delivery-admin.html">إدارة التوصيل</a><a href="#">EN</a><span id="driver-user"></span><button id="logout" class="bd-btn ghost" style="display:none">خروج</button></nav></header><main class="bd-main"><section id="login" class="bd-card" style="max-width:440px;margin:40px auto"><h2>دخول المندوب</h2><form id="loginForm" style="display:grid;gap:12px"><input id="email" type="email" required value="delivery.driver@test.com" placeholder="البريد الإلكتروني"><input id="password" type="password" required placeholder="كلمة المرور"><button class="bd-btn orange">تسجيل الدخول</button><div id="loginMsg"></div></form></section><section id="app" style="display:none"><section class="bd-card"><button id="online" class="bd-btn primary">ONLINE</button><span id="onlineBadge" class="bd-badge warning">غير متصل</span><div id="msg"></div></section><section class="bd-card" style="margin-top:18px"><h2>طلب جديد</h2><div id="orders">جاري تحميل الطلبات...</div></section><section class="bd-card" style="margin-top:18px"><h2>التوصيلات النشطة</h2><div id="active">لا توجد توصيلات نشطة</div></section><div class="bd-grid cards" style="margin-top:18px"><section class="bd-card"><div>اليوم</div><strong id="today">0.000 OMR</strong></section><section class="bd-card"><div>هذا الأسبوع</div><strong id="week">0.000 OMR</strong></section></div></section></main><script src="bingo-delivery.js?v=driver-v3"></script><script>(async()=>{const sb=window.sb;const DRIVER='delivery.driver@test.com';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showLogin(){
$('login').style.display='block';$('app').style.display='none';$('logout').style.display='none'}function showApp(u){$('login').style.display='none';$('app').style.display='block';$('logout').style.display='inline-block';$('driver-user').textContent=u.email||''}async function ensure(online){const r=await sb.rpc('delivery_set_driver_status',{p_online:online});if(r.error)throw r.error}async function load(){const r=await sb.auth.getUser();if(r.error)throw r.error;const u=r.data.user;if(!u){showLogin();return}if((u.email||'').toLowerCase()!==DRIVER){await sb.auth.signOut();showLogin();return}showApp(u);let d=await sb.from('delivery_drivers').select('id,is_online,is_available').eq('id',u.id).maybeSingle();if(d.error)throw d.error;if(!d.data)await ensure(true);d=await sb.from('delivery_drivers').select('id,is_online,is_available').eq('id',u.id).maybeSingle();if(d.error)throw d.error;const online=!!d.data?.is_online;$('online').textContent=online?'OFFLINE':'ONLINE';$('onlineBadge').textContent=online?'متصل':'غير متصل';$('onlineBadge').className='bd-badge '+(online?'success':'warning');const q=await sb.from('delivery_assignments').select('id,status,order_id,driver_id,offered_at,delivery_orders(id,order_number,status,total,delivery_fee,driver_share,delivery_address,distance_km,store_id)').eq('driver_id',u.id).in('status',['offered','accepted','picked_up','on_delivery']).order('offered_at',{ascending:false});if(q.error)throw q.error;const rows=q.data||[];const offered=rows.filter(x=>x.status==='offered');const active=rows.filter(x=>['accepted','picked_up','on_delivery'].includes(x.status));$('orders').innerHTML=offered.length?offered.map(a=>{const o=a.delivery_orders||{};const pay=Number(o.driver_share??0);const dist=Number(o.distance_km??0);return `<article class="delivery-order-card"><h3>#${esc(o.order_number||a.order_id)}</h3><p>📍 التسليم: ${esc(o.delivery_address||'')}</p><p>🚚 المسافة: ${dist.toFixed(2)} km</p><p>💰 أجر المندوب: <strong>${pay.toFixed(3)} OMR</strong></p><div class="bd-actions"><button class="bd-btn primary" data-a="accept" data-id="${a.id}">قبول</button><button class="bd-btn ghost" data-a="reject" data-id="${a.id}">رفض</button></div></article>`}).join(''):'<p>لا توجد طلبات جديدة</p>';$('active').innerHTML=active.length?active.map(a=>{const o=a.delivery_orders||{};let b='';if(a.status==='accepted')b=`<button class="bd-btn orange" data-a="pickup" data-id="${a.id}">استلام</button>`;else if(a.status==='picked_up')b=`<button class="bd-btn primary" data-a="delivery" data-id="${a.id}">في الطريق</button>`;else if(a.status==='on_delivery')b=`<button class="bd-btn primary" data-a="delivered" data-id="${a.id}">تم التسليم</button>`;return `<article class="delivery-order-card"><h3>#${esc(o.order_number||a.order_id)}</h3><p>الحالة: ${esc(a.status)}</p><p>💰 أجر المندوب: ${Number(o.driver_share??0).toFixed(3)} OMR</p><p>📍 ${esc(o.delivery_address||'')}</p><div class="bd-actions">${b}</div></article>`}).join(''):'لا توجد توصيلات نشطة';await earnings(u.id)}async function earnings(id){const now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString();const day=(now.getDay()+6)%7;const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day).toISOString();const q=await sb.from('delivery_earnings').select('amount,created_at').eq('driver_id',id).gte('created_at',weekStart);if(q.error)return;const rs=q.data||[];$('today').textContent=rs.filter(x=>x.created_at>=start).reduce((s,x)=>s+Number(x.amount||0),0).toFixed(3)+' OMR';$('week').textContent=rs.reduce((s,x)=>s+Number(x.amount||0),0).toFixed(3)+' OMR'}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='جاري تسجيل الدخول...';const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent='فشل تسجيل الدخول: '+r.error.message;return}await load().catch(e=>$('loginMsg').textContent=e.message)};$('logout').onclick=async()=>{await sb.auth.signOut();showLogin()};$('online').onclick=async()=>{try{const r=await sb.auth.getUser();if(!r.data.user)return showLogin();await ensure($('online').textContent==='ONLINE');await load()}catch(e){$('msg').textContent=e.message}};document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;try{if(b.dataset.a==='accept')await BingoDelivery.decideAssignment(b.dataset.id,true);if(b.dataset.a==='reject')await BingoDelivery.decideAssignment(b.dataset.id,false);if(b.dataset.a==='pickup')await BingoDelivery.setAssignmentStatus(b.dataset.id,'picked_up');if(b.dataset.a==='delivery')await BingoDelivery.setAssignmentStatus(b.dataset.id,'on_delivery');if(b.dataset.a==='delivered')await BingoDelivery.setAssignmentStatus(b.dataset.id,'delivered');$('msg').textContent='تم تحديث الطلب';await load()}catch(e){$('msg').textContent=e.message||'تعذر تحديث الطلب'}});if(!sb?.auth){$('loginMsg').textContent='Supabase لم يتم تحميله';return}await load().catch(e=>{console.error(e);showLogin();$('loginMsg').textContent=e.message||'تسجيل الدخول مطلوب'});sb.auth.onAuthStateChange(()=>setTimeout(()=>load().catch(console.error),0));setInterval(()=>{$('app').style.display!=='none'&&load().catch(console.error)},15000)})()</script></body></html>
