<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Driver</title><link rel="stylesheet" href="bingo-delivery.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Driver<small data-bd-i18n="driver">المندوب</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html" data-bd-i18n="customer">العميل</a><a href="bingo-delivery-seller.html" data-bd-i18n="seller">البائع</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="#" data-delivery-action="language" data-bd-language>EN</a></nav></header><main class="bd-main"><section class="bd-card"><div class="bd-actions"><button class="bd-btn primary" id="driver-online" data-delivery-action="online" data-bd-i18n="online">متصل</button><span class="bd-badge success" id="driver-state" data-bd-i18n="offline">غير متصل</span></div></section><section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="orders">الطلبات</h2><div id="driver-orders" class="bd-list"><p data-bd-i18n="noActive">لا توجد توصيلات نشطة</p></div></section><section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="earnings">الأرباح</h2><div class="bd-grid cards"><section class="bd-card"><div class="bd-muted" data-bd-i18n="today">اليوم</div><div class="bd-stat" id="driver-today">0.000 OMR</div></section><section class="bd-card"><div class="bd-muted" data-bd-i18n="thisWeek">هذا الأسبوع</div><div class="bd-stat" id="driver-week">0.000 OMR</div></section></div></section></main><script src="bingo-delivery.js"></script><script>
(function(){const sb=window.supabaseClient||window.sb||window.supabase;let online=false;let watch=null;function money(n){return Number(n||0).toFixed(3)+' OMR'}
async function load(){if(!sb?.from)return;const {data,error}=await sb.from('delivery_assignments').select('id,status,order_id,offered_at,delivery_orders(order_number,total,delivery_address,delivery_fee,driver_share)').in('status',['offered','accepted','picked_up','on_delivery']).order('offered_at',{ascending:false});if(error){console.error(error);return}const host=document.getElementById('driver-orders');host.innerHTML=data?.length?data.map(a=>{let action='';if(a.status==='offered')action=`<button class="bd-btn primary" data-delivery-action="accept" data-id="${a.id}">${BingoDelivery.t('accept')}</button><button class="bd-btn ghost" data-delivery-action="reject" data-id="${a.id}">${BingoDelivery.t('reject')}</button>`;else if(a.status==='accepted')action=`<button class="bd-btn orange" data-delivery-action="picked_up" data-id="${a.id}">${BingoDelivery.t('pickup')}</button>`;else if(a.status==='picked_up')action=`<button class="bd-btn primary" data-delivery-action="on_delivery" data-id="${a.id}">${BingoDelivery.t('onDelivery')}</button>`;else if(a.status==='on_delivery')action=`<button class="bd-btn primary" data-delivery-action="delivered" data-id="${a.id}">${BingoDelivery.t('delivered')}</button>`;return `<div class="bd-row"><div><strong>${a.delivery_orders?.order_number||a.order_id}</strong><div class="bd-muted">${a.delivery_orders?.delivery_address||''} · ${money(a.delivery_orders?.driver_share)}</div></div><span class="bd-badge warning">${BingoDelivery.t(a.status)||a.status}</span><div class="bd-actions">${action}</div></div>`}).join(''):`<p>${BingoDelivery.t('noActive')}</p>`}
async function earnings(){if(!sb?.from)return;const now=new Date(),start=new Date(now);start.setHours(0,0,0,0);const week=new Date(start);week.setDate(week.getDate()-((week.getDay()+6)%7));const [d,w]=await Promise.all([sb.from('delivery_earnings').select('amount').eq('status','paid').gte('created_at',start.toISOString()),sb.from('delivery_earnings').select('amount').eq('status','paid').gte('created_at',week.toISOString())]);document.getElementById('driver-today').textContent=money((d.data||[]).reduce((s,x)=>s+Number(x.amount||0),0));document.getElementById('driver-week').textContent=money((w.data||[]).reduce((s,x)=>s+Number(x.amount||0),0))}
async function setOnline(v){online=v;try{await BingoDelivery.setDriverStatus(v);document.getElementById('driver-state').textContent=v?BingoDelivery.t('online'):BingoDelivery.t('offline');document.getElementById('driver-online').textContent=v?BingoDelivery.t('offline'):BingoDelivery.t('online');if(v&&navigator.geolocation){watch=navigator.geolocation.watchPosition(p=>BingoDelivery.updateLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading,p.coords.speed?p.coords.speed*3.6:null).catch(()=>{}),()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}else if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}await load()}catch(e){online=!v;alert(e.message||'Unable to change status')}}
document.getElementById('driver-online').onclick=()=>setOnline(!online);document.addEventListener('click',async e=>{const b=e.target.closest('[data-delivery-action]');if(!b)return;if(['online','offline','language'].includes(b.dataset.deliveryAction))return;try{if(b.dataset.deliveryAction==='accept')await BingoDelivery.decideAssignment(b.dataset.id,true);else if(b.dataset.deliveryAction==='reject')await BingoDelivery.decideAssignment(b.dataset.id,false);else await BingoDelivery.setAssignmentStatus(b.dataset.id,b.dataset.deliveryAction);await load();await earnings()}catch(err){alert(err.message||'Action failed')}});load();earnings();if(sb?.channel)sb.channel('driver-live').on('postgres_changes',{event:'*',schema:'public',table:'delivery_assignments'},load).on('postgres_changes',{event:'*',schema:'public',table:'delivery_earnings'},earnings).subscribe();window.addEventListener('bingo:language',()=>{load()})})();</script></body></html>
