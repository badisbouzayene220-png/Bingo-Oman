<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Delivery Admin</title><link rel="stylesheet" href="bingo-delivery.css"></head><body><div class="bd-shell"><header class="bd-topbar"><div class="bd-brand">BINGO Delivery<small data-bd-i18n="admin">إدارة التوصيل</small></div><nav class="bd-nav"><a href="#orders" data-bd-i18n="orders">الطلبات</a><a href="#drivers" data-bd-i18n="drivers">المندوبون</a><a href="#zones" data-bd-i18n="zones">المناطق</a><a href="#complaints" data-bd-i18n="complaints">الشكاوى</a><a href="javascript:BingoDelivery.setLang(BingoDelivery.getLang()==='ar'?'en':'ar')" data-bd-language>EN</a></nav></header><main class="bd-main"><div class="bd-grid cards"><section class="bd-card"><div class="bd-muted">إجمالي الطلبات</div><div class="bd-stat" id="admin-total-orders">0</div></section><section class="bd-card"><div class="bd-muted">المندوبون المتصلون</div><div class="bd-stat" id="admin-online-drivers">0</div></section><section class="bd-card"><div class="bd-muted">إيرادات التوصيل</div><div class="bd-stat" id="admin-revenue">0.000 OMR</div></section><section class="bd-card"><div class="bd-muted">التوصيلات النشطة</div><div class="bd-stat" id="admin-active">0</div></section></div><section class="bd-card" id="orders" style="margin-top:18px"><h2 data-bd-i18n="orders">الطلبات</h2><div class="bd-list" id="admin-orders"></div></section><section class="bd-card" id="drivers" style="margin-top:18px"><h2 data-bd-i18n="drivers">المندوبون</h2><div class="bd-list" id="admin-drivers"></div></section><section class="bd-card" id="zones" style="margin-top:18px"><h2 data-bd-i18n="fees">رسوم التوصيل</h2><div class="bd-list" id="admin-pricing"></div></section></main></div><script src="bingo-delivery.js"></script><script>
(function(){const sb=window.supabaseClient||window.supabase;if(!sb?.from)return;const money=n=>Number(n||0).toFixed(3)+' OMR';
async function load(){
 const [orders,drivers,locs,pricing]=await Promise.all([
  sb.from('delivery_orders').select('id,order_number,status,total,delivery_address,store_id,created_at').order('created_at',{ascending:false}).limit(100),
  sb.from('delivery_drivers').select('id,display_name,is_online,is_available,rating,total_deliveries').order('display_name'),
  sb.from('delivery_driver_locations').select('driver_id,latitude,longitude,updated_at'),
  sb.from('delivery_pricing_rules').select('id,min_km,max_km,customer_fee,driver_share,bingo_share').eq('is_active',true).order('min_km')
 ]);
 if(orders.error||drivers.error||pricing.error){console.error(orders.error||drivers.error||pricing.error);return}
 const os=orders.data||[], ds=drivers.data||[], ps=pricing.data||[];
 document.getElementById('admin-total-orders').textContent=os.length;
 document.getElementById('admin-online-drivers').textContent=ds.filter(d=>d.is_online).length;
 document.getElementById('admin-active').textContent=os.filter(o=>!['delivered','cancelled'].includes(o.status)).length;
 document.getElementById('admin-revenue').textContent=money(os.reduce((s,o)=>s+Number(o.delivery_fee||0),0));
 const locMap=new Map((locs.data||[]).map(l=>[l.driver_id,l]));
 document.getElementById('admin-drivers').innerHTML=ds.length?ds.map(d=>{const l=locMap.get(d.id);return `<div class="bd-row"><div><strong>${d.display_name||d.id.slice(0,8)}</strong><div class="bd-muted">${d.is_online?'ONLINE':'OFFLINE'} · ${d.is_available?'Available':'Busy'} · ★ ${Number(d.rating||0).toFixed(2)}</div>${l?`<small>${Number(l.latitude).toFixed(5)}, ${Number(l.longitude).toFixed(5)}</small>`:''}</div></div>`}).join(''):'<p>No drivers</p>';
 document.getElementById('admin-orders').innerHTML=os.length?os.map(o=>`<div class="bd-row"><div><strong>${o.order_number}</strong><div class="bd-muted">${o.delivery_address||''} · ${money(o.total)}</div></div><span class="bd-badge warning">${o.status}</span>${o.status==='ready'?`<select data-dispatch-order="${o.id}"><option value="">Assign driver…</option>${ds.filter(d=>d.is_online&&d.is_available).map(d=>`<option value="${d.id}">${d.display_name||d.id.slice(0,8)}</option>`).join('')}</select>`:''}</div>`).join(''):'<p>No orders</p>';
 document.getElementById('admin-pricing').innerHTML=ps.length?ps.map(p=>`<div class="bd-row"><span>${p.min_km}–${p.max_km??'∞'} km</span><strong>${money(p.customer_fee)}</strong><span>Driver ${money(p.driver_share)} · Bingo ${money(p.bingo_share)}</span></div>`).join(''):'<p>No active pricing rules</p>';
}
document.addEventListener('change',async e=>{const s=e.target.closest('[data-dispatch-order]');if(!s||!s.value)return;try{await BingoDelivery.assignDriver(s.dataset.dispatchOrder,s.value);await load()}catch(err){alert(err.message||'Assignment failed');}});
load();if(sb.channel)sb.channel('delivery-admin-live').on('postgres_changes',{event:'*',schema:'public',table:'delivery_orders'},load).on('postgres_changes',{event:'*',schema:'public',table:'delivery_drivers'},load).on('postgres_changes',{event:'*',schema:'public',table:'delivery_driver_locations'},load).subscribe();})();</script></body></html>
