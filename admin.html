<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BINGO Oman | Admin Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script src="language.js"></script>
<style>.admin-wrap{background:#f6f8fc;min-height:100vh;padding:34px 0}.admin-card{background:#fff;border:1px solid #e6eaf1;border-radius:18px;padding:20px;margin-bottom:18px}.admin-table{width:100%;border-collapse:collapse;font-size:11px}.admin-table th,.admin-table td{padding:12px 9px;border-bottom:1px solid #edf0f5;text-align:left}.actions-cell{display:flex;gap:5px;flex-wrap:wrap}.mini-btn{border:1px solid #dce3ee;background:#fff;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800;cursor:pointer}.mini-btn.primary{color:#fff;background:#092a82;border-color:#092a82}.mini-btn.danger{color:#a52020}.modal{position:fixed;inset:0;background:#061331aa;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.modalbox{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f2f4f8;border-radius:50%;width:34px;height:34px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-grid label{display:block;font-size:11px;font-weight:800;color:#556173;margin-bottom:5px}.form-grid select{width:100%;padding:11px;border:1px solid #dce3ee;border-radius:10px}</style>
</head><body>
<header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav></div></header>
<main class="admin-wrap"><div class="container"><h1>BINGO Control Center</h1><p>Manage platform activity.</p><div id="denied" class="admin-card" style="display:none">Admin access required.</div><section id="adminApp" style="display:none"><div class="admin-card"><h2>Marketplace Listings</h2><div id="listingTable"></div></div></section></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){document.getElementById('denied').style.display='block';return}document.getElementById('adminApp').style.display='block';loadListings()}
async function loadListings(){const {data,error}=await sb.from('listings').select('id,title,status,city,price,created_at,promotion_type,promotion_expires_at').order('created_at',{ascending:false}).limit(200);const box=document.getElementById('listingTable');if(error){box.textContent=error.message;return}box.innerHTML='<table class="admin-table"><thead><tr><th>Listing</th><th>Status</th><th>City</th><th>Price</th><th>Promotion</th><th>Actions</th></tr></thead><tbody>'+(data||[]).map(x=>`<tr><td><a href="listing.html?id=${x.id}" target="_blank">${esc(x.title)}</a></td><td>${esc(x.status)}</td><td>${esc(x.city||'')}</td><td>${Number(x.price||0).toFixed(3)} OMR</td><td>${x.promotion_type&&new Date(x.promotion_expires_at)>new Date()?`<b>${esc(x.promotion_type)}</b><br><small>until ${new Date(x.promotion_expires_at).toLocaleDateString()}</small>`:'—'}</td><td class="actions-cell">${x.status==='published'?`<button class="mini-btn primary" onclick="openPromotion('${x.id}')">⭐ Promote</button>`:''}</td></tr>`).join('')+'</tbody></table>'}
function openPromotion(id){let m=document.getElementById('adminPromoModal');m.dataset.id=id;m.classList.add('open');document.getElementById('apMsg').textContent=''}
async function savePromotion(){const id=document.getElementById('adminPromoModal').dataset.id,type=document.getElementById('apType').value,days=Number(document.getElementById('apDays').value),msg=document.getElementById('apMsg');msg.textContent='Saving…';const {error}=await sb.rpc('admin_set_listing_promotion',{p_listing_id:id,p_promotion_type:type,p_duration_days:days});if(error){msg.textContent=error.message;return}msg.textContent='Promotion activated successfully.';await loadListings();setTimeout(()=>document.getElementById('adminPromoModal').classList.remove('open'),500)}
async function stopPromotion(){const id=document.getElementById('adminPromoModal').dataset.id,msg=document.getElementById('apMsg');const {error}=await sb.rpc('admin_clear_listing_promotion',{p_listing_id:id});if(error){msg.textContent=error.message;return}msg.textContent='Promotion stopped.';await loadListings();setTimeout(()=>document.getElementById('adminPromoModal').classList.remove('open'),500)}
init();
</script>
<div class="modal" id="adminPromoModal"><div class="modalbox" style="max-width:560px"><div class="modalhead"><h2>Listing promotion</h2><button class="close" onclick="this.closest('.modal').classList.remove('open')">×</button></div><p>Activate a promotion manually for testing or customer service.</p><div class="form-grid"><div><label>Promotion</label><select id="apType"><option value="highlight">✨ Highlight</option><option value="featured">⭐ Featured</option><option value="top">🚀 Top Ad</option></select></div><div><label>Duration</label><select id="apDays"><option value="1">1 day</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></div></div><div id="apMsg" style="margin:14px 0"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="mini-btn danger" onclick="stopPromotion()">Stop promotion</button><button class="btn primary" onclick="savePromotion()">Activate</button></div></div></div>
<script src="admin-listing-promotions.js?v=20260822-2"></script>
</body></html>
