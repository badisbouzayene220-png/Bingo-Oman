<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Login</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="auth"><div class="box"><h1>BINGO Oman</h1><h2>Login</h2><form id="f"><input id="email" type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required><button>Login</button></form><p id="m"></p><a href="register.html">Create account</a></div></main><script>f.onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:p.value});if(error)m.textContent=error.message;else location.href="dashboard.html"}</script></body></html>
