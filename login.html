<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman - Login</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="language.js"></script><link rel="stylesheet" href="characters.css">
<link rel="stylesheet" href="global-banner.css">
</head><body><main class="auth"><div class="authbox"><div class="authbrand"><img src="logo-en.png" alt="BINGO Oman"></div><h1>Welcome back</h1><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary" id="loginBtn" type="submit">Login</button></form><p class="msg" id="message"></p><div class="authlinks">New to BINGO? <a href="register.html">Create an account</a></div></div></main><script>document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();let m=document.getElementById("message"),b=document.getElementById("loginBtn");b.disabled=true;b.textContent="Logging in…";try{let r=await Promise.race([sb.auth.signInWithPassword({email:email.value.trim(),password:password.value}),new Promise((_,x)=>setTimeout(()=>x(new Error("Connection timed out after 15 seconds.")),15000))]);if(r.error)throw r.error;const next=new URLSearchParams(location.search).get("next"); location.href=(next && next.startsWith("/") ? next : "dashboard.html")}catch(err){m.textContent="Login error: "+(err.message||err);b.disabled=false;b.textContent="Login"}})</script><script src="characters.js"></script>
</body></html>
