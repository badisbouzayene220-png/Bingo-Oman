<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Login</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="auth"><div class="box"><h1>BINGO Oman</h1><h2>Welcome back</h2><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn" id="b">Login</button></form><div class="msg" id="m"></div><p><a href="register.html">Create account</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();b.disabled=true;b.textContent='Logging in...';m.textContent='';try{const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)throw r.error;location.href='index.html'}catch(x){m.textContent=x.message;b.disabled=false;b.textContent='Login'}}</script></body></html>
