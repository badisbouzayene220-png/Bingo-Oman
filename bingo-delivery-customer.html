<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Customer Delivery</title><link rel="stylesheet" href="bingo-delivery.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Customer<small data-bd-i18n="customer">العميل</small></div><nav class="bd-nav"><a href="bingo-delivery-seller.html" data-bd-i18n="seller">البائع</a><a href="bingo-delivery-driver.html" data-bd-i18n="driver">المندوب</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="#" data-delivery-action="language" data-bd-language>EN</a></nav></header><main class="bd-main"><section class="bd-card"><h2 data-bd-i18n="checkout">إتمام الطلب</h2><div class="bd-form"><label data-bd-i18n="deliveryAddress">عنوان التوصيل<input id="delivery-address" data-bd-placeholder="search" placeholder="بحث"></label><label data-bd-i18n="location">الموقع<button id="use-location" class="bd-btn ghost" type="button" data-delivery-action="use-location">📍 استخدام موقعي الحالي</button></label><label data-bd-i18n="deliveryOption">خيار التوصيل<select id="delivery-option"><option value="1.500">Standard Delivery · 1.500 OMR</option><option value="2.000">Express Delivery · 2.000 OMR</option></select></label><input id="delivery-lat" type="hidden"><input id="delivery-lng" type="hidden"><input id="delivery-distance" type="hidden" value="0"><input id="delivery-store-id" type="hidden"><label data-bd-i18n="orderItems">المنتجات<textarea id="delivery-items" rows="4" placeholder='[{"description":"Product","quantity":1,"unit_price":20}]'></textarea></label><div class="bd-row"><span data-bd-i18n="deliveryFee">رسوم التوصيل</span><strong id="delivery-fee">1.500 OMR</strong></div><div class="bd-row"><span data-bd-i18n="total">الإجمالي</span><strong id="delivery-total">21.500 OMR</strong></div><button id="create-delivery-order" class="bd-btn orange" data-delivery-action="create-order" data-bd-i18n="confirmOrder">تأكيد الطلب</button><p id="checkout-message" role="status"></p></div></section><section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="myOrders">طلباتي</h2><div id="delivery-orders"></div></section><section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="onDelivery">قيد التوصيل</h2><div class="bd-map"><span class="bd-marker" style="top:50%;left:50%">🛵</span><span class="bd-marker" style="top:68%;left:25%">📍</span></div><div class="bd-actions" style="margin-top:14px"><button class="bd-btn primary" data-bd-i18n="rateDriver">تقييم المندوب</button></div></section></main><script src="bingo-delivery.js"></script></body></html>
