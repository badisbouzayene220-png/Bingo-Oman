<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo Customer Delivery</title>
<link rel="stylesheet" href="bingo-delivery.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
<style>
.bd-store-grid,.bd-product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.bd-shop-card{border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:16px;background:#fff;cursor:pointer;transition:.2s}.bd-shop-card:hover,.bd-shop-card.active{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.bd-shop-card h3,.bd-product-card h3{margin:0 0 8px}.bd-product-card{border:1px solid rgba(0,0,0,.1);border-radius:16px;padding:16px;background:#fff}.bd-product-card .price{font-weight:700;margin:10px 0}.bd-qty{display:flex;align-items:center;gap:8px;margin-top:10px}.bd-qty button{min-width:34px}.bd-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.bd-muted{opacity:.7}.bd-cart-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.08)}
</style>
</head>
<body>
<header class="bd-topbar"><div class="bd-brand">BINGO Customer<small data-bd-i18n="customer">العميل</small></div><nav class="bd-nav"><a href="bingo-delivery-seller.html" data-bd-i18n="seller">البائع</a><a href="bingo-delivery-driver.html" data-bd-i18n="driver">المندوب</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="#" data-delivery-action="language" data-bd-language>EN</a></nav></header>
<main class="bd-main">
<section class="bd-card"><div class="bd-section-title"><h2 data-bd-i18n="stores">المتاجر</h2><span id="store-count" class="bd-muted"></span></div><div id="store-list" class="bd-store-grid"><p>جاري تحميل المتاجر...</p></div></section>
<section class="bd-card" style="margin-top:18px"><div class="bd-section-title"><h2 data-bd-i18n="products">المنتجات</h2><span id="selected-store-name" class="bd-muted"></span></div><div id="product-list" class="bd-product-grid"><p class="bd-muted">اختر متجرًا لعرض المنتجات</p></div></section>
<section class="bd-card" style="margin-top:18px"><div class="bd-section-title"><h2 data-bd-i18n="cart">السلة</h2><span id="cart-count" class="bd-muted">0</span></div><div id="cart-list"><p class="bd-muted">السلة فارغة</p></div></section>
<section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="checkout">إتمام الطلب</h2><div class="bd-form">
<label data-bd-i18n="deliveryAddress">عنوان التوصيل<input id="delivery-address" data-bd-placeholder="search" placeholder="بحث"></label>
<label data-bd-i18n="location">الموقع<button id="use-location" class="bd-btn ghost" type="button" data-delivery-action="use-location">📍 استخدام موقعي الحالي</button></label>
<label data-bd-i18n="deliveryOption">خيار التوصيل<select id="delivery-option"><option value="1.500">Standard Delivery · 1.500 OMR</option><option value="2.000">Express Delivery · 2.000 OMR</option></select></label>
<input id="delivery-lat" type="hidden"><input id="delivery-lng" type="hidden"><input id="delivery-distance" type="hidden" value="0"><input id="delivery-store-id" type="hidden">
<textarea id="delivery-items" rows="4" hidden></textarea>
<div class="bd-row"><span data-bd-i18n="subtotal">الإجمالي الفرعي</span><strong id="delivery-subtotal">0.000 OMR</strong></div>
<div class="bd-row"><span data-bd-i18n="deliveryFee">رسوم التوصيل</span><strong id="delivery-fee">1.500 OMR</strong></div>
<div class="bd-row"><span data-bd-i18n="total">الإجمالي</span><strong id="delivery-total">1.500 OMR</strong></div>
<button id="create-delivery-order" class="bd-btn orange" data-delivery-action="create-order" data-bd-i18n="confirmOrder">تأكيد الطلب</button><p id="checkout-message" role="status"></p></div></section>
<section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="myOrders">طلباتي</h2><div id="delivery-orders"></div></section>
<section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="onDelivery">قيد التوصيل</h2><div class="bd-map"><span class="bd-marker" style="top:50%;left:50%">🛵</span><span class="bd-marker" style="top:68%;left:25%">📍</span></div></section>
</main>
<script src="bingo-delivery.js"></script>
<script>
(function(){
'use strict';
const sb=window.supabaseClient||window.sb||window.supabase;let stores=[],products=[],cart=new Map(),selectedStore=null;
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const lang=()=>localStorage.getItem('bingo_delivery_lang')==='en'?'en':'ar';
const name=(s,a,e)=>lang()==='ar'?(a||s):(e||s);
function renderStores(){const el=document.querySelector('#store-list'),c=document.querySelector('#store-count');c.textContent=stores.length+' '+(lang()==='ar'?'متجر':'stores');if(!stores.length){el.innerHTML='<p>لا توجد متاجر متاحة حاليًا</p>';return}el.innerHTML=stores.map(s=>`<article class="bd-shop-card ${selectedStore?.id===s.id?'active':''}" data-store="${s.id}"><h3>${esc(name(s,s.store_name_ar,s.store_name_en))}</h3><p>${esc(s.address||'')}</p><small>🚚 ${lang()==='ar'?'توصيل متاح':'Delivery available'}</small></article>`).join('');el.querySelectorAll('[data-store]').forEach(x=>x.onclick=()=>selectStore(x.dataset.store));}
function renderProducts(){const el=document.querySelector('#product-list');document.querySelector('#selected-store-name').textContent=selectedStore?name(selectedStore,selectedStore.store_name_ar,selectedStore.store_name_en):'';const list=products.filter(p=>p.store_id===selectedStore?.id);if(!selectedStore){el.innerHTML='<p class="bd-muted">اختر متجرًا لعرض المنتجات</p>';return}if(!list.length){el.innerHTML='<p>لا توجد منتجات متاحة في هذا المتجر</p>';return}el.innerHTML=list.map(p=>{const q=cart.get(p.id)?.quantity||0;return `<article class="bd-product-card"><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><div class="price">${Number(p.price).toFixed(3)} OMR</div><small>المخزون: ${p.stock}</small><div class="bd-qty"><button type="button" data-minus="${p.id}">−</button><strong>${q}</strong><button type="button" data-plus="${p.id}">+</button></div></article>`}).join('');el.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));el.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));}
function changeQty(id,d){const p=products.find(x=>x.id===id);if(!p)return;let q=(cart.get(id)?.quantity||0)+d;q=Math.max(0,Math.min(q,p.stock||0));if(!q)cart.delete(id);else cart.set(id,{...p,quantity:q});renderProducts();renderCart();syncOrderItems();}
function renderCart(){const el=document.querySelector('#cart-list'),arr=[...cart.values()];document.querySelector('#cart-count').textContent=arr.reduce((n,x)=>n+x.quantity,0);if(!arr.length){el.innerHTML='<p class="bd-muted">السلة فارغة</p>';return}el.innerHTML=arr.map(x=>`<div class="bd-cart-line"><span>${esc(x.title)} × ${x.quantity}</span><strong>${(x.quantity*Number(x.price)).toFixed(3)} OMR</strong></div>`).join('');}
function syncOrderItems(){
  const items=[...cart.values()].map(x=>({description:x.title,quantity:x.quantity,unit_price:Number(x.price)}));
  document.querySelector('#delivery-items').value=JSON.stringify(items);
  document.querySelector('#delivery-store-id').value=selectedStore?.id||'';
  const subtotal=items.reduce((n,x)=>n+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0);
  const fee=Number(document.querySelector('#delivery-option')?.value||0);
  const total=subtotal+fee;
  document.querySelector('#delivery-subtotal').textContent=subtotal.toFixed(3)+' OMR';
  document.querySelector('#delivery-fee').textContent=fee.toFixed(3)+' OMR';
  document.querySelector('#delivery-total').textContent=total.toFixed(3)+' OMR';
  // Shared bingo-delivery.js may recalculate from the hidden textarea.
  document.querySelector('#delivery-items').dispatchEvent(new Event('input',{bubbles:true}));
  // Make Customer the final authority after the shared listener finishes.
  requestAnimationFrame(()=>{
    const finalItems=JSON.parse(document.querySelector('#delivery-items').value||'[]');
    const finalSubtotal=finalItems.reduce((n,x)=>n+(Number(x.quantity)||0)*(Number(x.unit_price)||0),0);
    const finalFee=Number(document.querySelector('#delivery-option')?.value||0);
    document.querySelector('#delivery-subtotal').textContent=finalSubtotal.toFixed(3)+' OMR';
    document.querySelector('#delivery-fee').textContent=finalFee.toFixed(3)+' OMR';
    document.querySelector('#delivery-total').textContent=(finalSubtotal+finalFee).toFixed(3)+' OMR';
  });
}
async function selectStore(id){selectedStore=stores.find(s=>s.id===id)||null;cart.clear();renderStores();renderProducts();renderCart();syncOrderItems();}
async function loadCatalog(){if(!sb?.from)return;const [sr,pr]=await Promise.all([sb.from('delivery_stores').select('id,owner_id,store_name,store_name_ar,store_name_en,phone,address,latitude,longitude,is_active').eq('is_active',true).order('created_at',{ascending:false}),sb.from('store_products').select('id,store_id,title,description,price,image_url,category,stock,is_active,sort_order').eq('is_active',true).gt('stock',0).order('sort_order',{ascending:true})]);if(sr.error){console.error(sr.error);document.querySelector('#store-list').innerHTML='<p>تعذر تحميل المتاجر</p>';return}stores=sr.data||[];products=pr.error?[]:(pr.data||[]);renderStores();renderProducts();renderCart();syncOrderItems();if(stores.length)selectStore(stores[0].id);}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#delivery-option')?.addEventListener('change',syncOrderItems);loadCatalog();window.addEventListener('bingo:language',()=>{renderStores();renderProducts();renderCart();syncOrderItems();});});
})();
</script>
</body></html>
