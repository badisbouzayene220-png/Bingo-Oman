<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Dashboard</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><header><b>BINGO Oman</b><button id="out">Logout</button></header><main><h1 id="w">Loading...</h1><div class="box" id="p">Loading profile...</div></main><script>async function go(){const{data:{user}}=await sb.auth.getUser();if(!user)return location.href="login.html";const{data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();if(error)p.textContent=error.message;else{w.textContent="Welcome, "+data.full_name;p.innerHTML="Username: "+(data.username||"—")+"<br>Email: "+user.email+"<br>Phone: "+(data.phone||"—")+"<br>Account: "+data.account_type+"<br>City: "+(data.city||"—")+"<br>Role: "+data.role}}out.onclick=async()=>{await sb.auth.signOut();location.href="index.html"};go()</script></body></html>
