<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | BINGO Oman</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><header><a class="brand" href="index.html">BINGO <span>Oman</span></a><nav><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><button class="btn" id="out">Logout</button></header><main class="dash"><h1 id="welcome">My Account</h1><p class="muted">Manage your BINGO account.</p><div class="profilebox" id="profile">Loading...</div></main><script>async function go(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='login.html';return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error){profile.textContent=error.message;return}welcome.textContent='Welcome, '+(p.full_name||'BINGO User');profile.innerHTML='<b>Username:</b> '+(p.username||'—')+'<br><b>Email:</b> '+user.email+'<br><b>Phone:</b> '+(p.phone||'—')+'<br><b>Account:</b> '+p.account_type+'<br><b>City:</b> '+(p.city||'—')+'<br><b>Role:</b> '+p.role}out.onclick=async()=>{await sb.auth.signOut();location.href='index.html'};go()</script></body></html>
