<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Checkout</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><style>.checkout{display:grid;grid-template-columns:1.4fr .8fr;gap:25px;padding:35px 0}.card{background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:22px}.form{display:grid;gap:13px}.form input,.form textarea,.form select{padding:13px;border:1px solid #ccd5e2;border-radius:10px;width:100%;box-sizing:border-box}.cartrow{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}.cartrow img{width:56px;height:56px;object-fit:cover;border-radius:10px}.tot{font-size:22px;font-weight:900;color:#092a82;margin-top:18px}.remove{border:0;background:none;color:#c33;cursor:pointer}.account-prefill{padding:10px 12px;border-radius:10px;background:#f3f8ff;color:#16427d;font-size:13px;display:none}@media(max-width:800px){.checkout{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="characters.css">
<link rel="stylesheet" href="global-banner.css">
</head><body><header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a href="store.html">Store</a><a href="orders.html">My Orders</a></nav><div class="actions"><a class="btn primary small" href="store.html">Continue shopping</a></div></div></header><main class="pagebody"><div class="container"><div class="checkout"><section class="card"><h1>Checkout</h1><div id="msg"></div><div id="account-prefill" class="account-prefill">✓ Your account details were filled automatically. You can edit them for this order.</div><form class="form" id="form"><input id="name" placeholder="Full name" autocomplete="name" required><input id="phone" placeholder="Phone number" autocomplete="tel" required><input id="email" type="email" placeholder="Email (optional)" autocomplete="email"><textarea id="address" rows="4" placeholder="Delivery address" autocomplete="street-address" required></textarea><select id="payment"><option value="cash_on_delivery">Cash on delivery</option><option value="bank_transfer">Bank transfer</option><option value="contact_before_payment">Contact me before payment</option></select><textarea id="notes" rows="3" placeholder="Order notes (optional)"></textarea><button class="btn primary">Place order</button></form></section><aside class="card"><h2>Your cart</h2><div id="cart"></div></aside></div></div></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let items=[];
function loadCart(){items=JSON.parse(localStorage.getItem('bingo_cart')||'[]');render()}
function render(){if(!items.length){$('cart').innerHTML='<p>Your cart is empty.</p><a href="store.html">Browse products</a>';$('form').style.display='none';return}let sub=items.reduce((s,x)=>s+x.price*x.quantity,0);$('cart').innerHTML=items.map((x,i)=>`<div class="cartrow"><div>${x.image_url?`<img src="${esc(x.image_url)}">`:'🛍️'}</div><div><b>${esc(x.title)}</b><div>${x.quantity} × ${Number(x.price).toFixed(3)} OMR</div></div><button class="remove" onclick="removeItem(${i})">Remove</button></div>`).join('')+`<div class="tot">Total: ${sub.toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div>`}
window.removeItem=i=>{items.splice(i,1);localStorage.setItem('bingo_cart',JSON.stringify(items));render()};
async function prefillCheckoutFromAccount(){
  try{
    const user=await BingoAuth.getUser();
    if(!user)return;
    const meta=user.user_metadata||{};
    let profile={};
    try{
      const r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
      if(!r.error&&r.data)profile=r.data;
    }catch(_){ }
    const fullName=profile.full_name||profile.display_name||profile.name||meta.full_name||meta.name||'';
    const phone=profile.phone||profile.phone_number||meta.phone||meta.phone_number||'';
    const email=profile.email||user.email||meta.email||'';
    const address=profile.address||profile.delivery_address||meta.address||'';
    if(!$('name').value&&fullName)$('name').value=fullName;
    if(!$('phone').value&&phone)$('phone').value=phone;
    if(!$('email').value&&email)$('email').value=email;
    if(!$('address').value&&address)$('address').value=address;
    if(fullName||phone||email||address)$('account-prefill').style.display='block';
  }catch(e){console.warn('BINGO checkout account prefill:',e)}
}
$('form').addEventListener('submit',async e=>{e.preventDefault();const user=await BingoAuth.getUser();if(!user){location.href='login.html?next=checkout.html';return}const payload=items.map(x=>({product_id:x.product_id,quantity:x.quantity}));const {data,error}=await sb.rpc('place_store_order',{p_items:payload,p_customer_name:$('name').value,p_phone:$('phone').value,p_email:$('email').value,p_address:$('address').value,p_notes:$('notes').value,p_payment_method:$('payment').value,p_delivery_fee:0});if(error){$('msg').innerHTML='<div class="notice err">'+esc(error.message)+'</div>';return}localStorage.removeItem('bingo_cart');location.href='orders.html?success='+encodeURIComponent(data.order_number)});
loadCart();prefillCheckoutFromAccount();
</script><script src="language.js"></script><script src="bingo-cart-delivery-bridge.js?v=20260820-account-prefill-1"></script><script src="characters.js"></script>
</body></html>
