<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman - Register</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="language.js"></script><link rel="stylesheet" href="characters.css">
<link rel="stylesheet" href="global-banner.css">
</head><body><main class="auth"><div class="authbox"><div class="authbrand"><img src="logo-en.png" alt="BINGO Oman"></div><h1>Create your BINGO account</h1><form id="registerForm"><input id="fullName" autocomplete="name" placeholder="Full name" required><input id="username" autocomplete="username" placeholder="Username" minlength="4" maxlength="30" pattern="[A-Za-z0-9_]{4,30}" title="Use 4–30 letters, numbers, or underscores." required><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="phone" type="tel" autocomplete="tel" placeholder="Oman phone"><select id="accountType"><option value="individual">Individual</option><option value="company">Company</option></select><input id="city" autocomplete="address-level2" placeholder="City"><input id="password" type="password" autocomplete="new-password" placeholder="Password" minlength="8" required><small style="display:block;margin:-6px 0 10px;color:#667085">Use 8+ characters with uppercase, lowercase, a number, and a symbol.</small><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password" minlength="8" required><button class="btn primary" id="submitBtn" type="submit">Create account</button></form><p class="msg" id="message"></p><div class="authlinks">Already have an account? <a href="login.html">Login</a></div></div></main><script>
const form=document.getElementById("registerForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");
function safeNext(raw){if(!raw)return 'dashboard.html';try{const u=new URL(raw,location.href);return u.origin===location.origin?u.href:'dashboard.html'}catch{return 'dashboard.html'}}
(async function handleEmailConfirmation(){
  try{
    const params=new URLSearchParams(location.search),code=params.get("code"),errorCode=params.get("error_code")||params.get("error"),errorDescription=params.get("error_description");
    if(errorCode){msg.textContent=errorCode==='otp_expired'?'This verification link has expired. Please create a new account request or request a new verification email.':(errorDescription?decodeURIComponent(errorDescription.replace(/\+/g,' ')):'Email verification failed.');return;}
    if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error)throw error;location.replace(safeNext(params.get("next")));return;}
    if(location.hash.includes('access_token=')){const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session){const next=params.get("next");history.replaceState({},document.title,location.pathname+location.search);location.replace(safeNext(next));}}
  }catch(err){msg.textContent='Email verification error: '+(err.message||err);}
})();
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";if(!form.reportValidity())return;btn.disabled=true;btn.textContent="Creating…";const p=password.value;const strongPassword=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;if(!strongPassword.test(p)){msg.textContent="Password must contain at least 8 characters, including uppercase, lowercase, a number, and a symbol.";btn.disabled=false;btn.textContent="Create account";password.focus();return}if(p!==confirmPassword.value){msg.textContent="Passwords do not match.";btn.disabled=false;btn.textContent="Create account";confirmPassword.focus();return}try{const emailValue=email.value.trim().toLowerCase();const next=new URLSearchParams(location.search).get('next');const redirect=new URL('register.html',window.location.href);if(next)redirect.searchParams.set('next',safeNext(next));const r=await Promise.race([sb.auth.signUp({email:emailValue,password:p,options:{emailRedirectTo:redirect.href,data:{full_name:fullName.value.trim(),username:username.value.trim().toLowerCase(),phone:phone.value.trim(),city:city.value.trim(),account_type:accountType.value}}}),new Promise((_,x)=>setTimeout(()=>x(new Error("Connection timed out.")),15000))]);if(r.error)throw r.error;if(r.data.session){location.replace(safeNext(next))}else{msg.textContent="Account created. Check your email and click the verification link. You will return to this page automatically.";btn.disabled=false;btn.textContent="Create account";}}catch(err){msg.textContent="Registration error: "+(err.message||err);btn.disabled=false;btn.textContent="Create account";}});
</script><script src="characters.js"></script>
</body></html>
