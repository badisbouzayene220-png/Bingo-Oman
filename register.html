<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Register</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="auth"><div class="box"><h1>BINGO Oman</h1><h2>Create account</h2><form id="f"><input id="name" placeholder="Full name" required><input id="username" placeholder="Username" required minlength="4"><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Oman phone"><select id="type"><option value="individual">Individual</option><option value="company">Company</option></select><input id="city" placeholder="City"><input id="p" type="password" placeholder="Password (8+ characters)" minlength="8" required><input id="c" type="password" placeholder="Confirm password" required><button>Register</button></form><p id="m"></p><a href="login.html">Already have an account? Login</a></div></main><script>f.onsubmit=async e=>{e.preventDefault();m.textContent="Creating...";if(p.value!==c.value){m.textContent="Passwords do not match";return}const{data,error}=await sb.auth.signUp({email:email.value.trim(),password:p.value,options:{data:{full_name:name.value.trim(),username:username.value.trim().toLowerCase(),phone:phone.value.trim(),city:city.value.trim(),account_type:type.value}}});if(error){m.textContent=error.message;return}m.textContent=data.session?"Success":"Check your email to verify your account.";if(data.session)location.href="dashboard.html"}</script></body></html>
