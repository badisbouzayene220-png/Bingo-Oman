<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Register</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script></head><body><main class="auth"><div class="box"><h1>BINGO Oman</h1><h2>Create account</h2><form id="f"><input id="fullName" placeholder="Full name" required><input id="username" placeholder="Username" minlength="4" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Oman phone"><select id="accountType"><option value="individual">Individual</option><option value="company">Company</option></select><input id="city" placeholder="City"><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><input id="confirm" type="password" placeholder="Confirm password" required><button class="btn" id="b">Register</button></form><div class="msg" id="m"></div><p><a href="login.html">Already have an account? Login</a></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();b.disabled=true;b.textContent='Creating...';m.textContent='';if(password.value!==confirm.value){m.textContent='Passwords do not match';b.disabled=false;b.textContent='Register';return}try{const r=await sb.auth.signUp({email:email.value.trim().toLowerCase(),password:password.value,options:{emailRedirectTo:location.origin+'/Bingo-Oman/index.html',data:{full_name:fullName.value.trim(),username:username.value.trim().toLowerCase(),phone:phone.value.trim(),city:city.value.trim(),account_type:accountType.value}}});if(r.error)throw r.error;m.textContent=r.data.session?'Account created.':'Account created. Check your email.';if(r.data.session)location.href='index.html';else{b.disabled=false;b.textContent='Register'}}catch(x){m.textContent=x.message;b.disabled=false;b.textContent='Register'}}</script></body></html>
