<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman - Register</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="language.js"></script></head><body><main class="auth"><div class="authbox"><div class="authbrand"><img src="logo-en.png" alt="BINGO Oman"></div><h1>Create your BINGO account</h1><form id="registerForm"><input id="fullName" placeholder="Full name" required><input id="username" placeholder="Username" minlength="4" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Oman phone"><select id="accountType"><option value="individual">Individual</option><option value="company">Company</option></select><input id="city" placeholder="City"><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><input id="confirmPassword" type="password" placeholder="Confirm password" required><button class="btn primary" id="submitBtn" type="submit">Create account</button></form><p class="msg" id="message"></p><div class="authlinks">Already have an account? <a href="login.html">Login</a></div></div></main><script>const form=document.getElementById("registerForm"),msg=document.getElementById("message"),btn=document.getElementById("submitBtn");form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;btn.textContent="Creating…";const p=password.value;if(p!==confirmPassword.value){msg.textContent="Passwords do not match.";btn.disabled=false;btn.textContent="Create account";return}try{const r=await Promise.race([sb.auth.signUp({email:email.value.trim().toLowerCase(),password:p,options:{data:{full_name:fullName.value.trim(),username:username.value.trim().toLowerCase(),phone:phone.value.trim(),city:city.value.trim(),account_type:accountType.value}}}),new Promise((_,x)=>setTimeout(()=>x(new Error("Connection timed out.")),15000))]);if(r.error)throw r.error;if(r.data.session)location.href="dashboard.html";else{msg.textContent="Account created. Check your email for verification.";btn.disabled=false;btn.textContent="Create account"}}catch(err){msg.textContent="Registration error: "+(err.message||err);btn.disabled=false;btn.textContent="Create account"}})</script></body></html>
