<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BINGO Oman | Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="language.js"></script>
<style>
.messages-page{padding:28px 0 50px}.messages-layout{display:grid;grid-template-columns:350px 1fr;gap:18px;min-height:650px}.messages-list,.chat-panel{background:#fff;border:1px solid #e7eaf0;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.05)}
.messages-list-head,.chat-head{padding:18px 20px;border-bottom:1px solid #edf0f4}.messages-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.messages-list-head h2,.chat-head h2{margin:0;font-size:20px}.unread-total,.unread-badge{display:inline-flex;align-items:center;justify-content:center;background:#ef4444;color:#fff;font-weight:800;border-radius:999px;min-width:22px;height:22px;padding:0 7px;font-size:11px}.conversation-items{max-height:590px;overflow:auto}.conversation-item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid #f0f2f5;background:#fff;text-align:left;padding:14px 16px;cursor:pointer}.conversation-item:hover,.conversation-item.active{background:#f7f9fc}.conversation-avatar,.chat-avatar{width:46px;height:46px;border-radius:50%;flex:0 0 46px;object-fit:cover;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-weight:800;color:#667085;overflow:hidden}.conversation-avatar img,.chat-avatar img{width:100%;height:100%;object-fit:cover}.conversation-main{min-width:0;flex:1}.conversation-top{display:flex;align-items:center;gap:8px}.conversation-top strong{color:#172033;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.conversation-time{font-size:10px;color:#98a2b3;white-space:nowrap}.conversation-main small{display:block;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-main .preview{margin-top:5px;font-size:13px}.conversation-unread{margin-left:auto}.chat-panel{display:flex;flex-direction:column;min-width:0}.chat-head{display:flex;align-items:center;gap:12px}.chat-title{min-width:0}.chat-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-title p{margin:4px 0 0;color:#667085;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-messages{flex:1;padding:22px;overflow:auto;background:#f8fafc;min-height:455px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(72%,620px);padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.bubble.mine{align-self:flex-end;background:#ff6b00;color:#fff;border-bottom-right-radius:5px}.bubble.theirs{align-self:flex-start;background:#fff;color:#172033;border:1px solid #e7eaf0;border-bottom-left-radius:5px}.bubble time{display:block;font-size:10px;opacity:.7;margin-top:4px}.chat-form{display:flex;gap:10px;padding:15px;border-top:1px solid #edf0f4;background:#fff}.chat-form textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:1px solid #d8dde6;border-radius:12px;padding:12px;font:inherit}.chat-form button{align-self:stretch;min-width:90px}.empty-chat{margin:auto;text-align:center;color:#667085;padding:30px}.listing-link{color:#ff6b00;font-weight:700;text-decoration:none}.listing-link:hover{text-decoration:underline}
@media(max-width:800px){.messages-layout{grid-template-columns:1fr}.messages-list{max-height:285px}.conversation-items{max-height:215px}.chat-panel{min-height:620px}.bubble{max-width:85%}.messages-page{padding-top:15px}}
</style>
</head>
<body>
<header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><button class="hamb" onclick="document.getElementById('navlinks').classList.toggle('open')">☰</button><nav class="navlinks" id="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><div class="actions"></div></div></header>
<main class="messages-page"><div class="container"><div class="messages-layout">
<section class="messages-list"><div class="messages-list-head"><h2>Messages</h2><span id="totalUnread" class="unread-total" style="display:none">0</span></div><div id="conversationList" class="conversation-items"><div class="empty-chat">Loading conversations…</div></div></section>
<section class="chat-panel"><div id="chatHead" class="chat-head"><div class="chat-avatar">💬</div><div class="chat-title"><h2>Select a conversation</h2><p>Your messages will appear here.</p></div></div><div id="chatMessages" class="chat-messages"><div class="empty-chat">Choose a conversation from the left.</div></div><form id="chatForm" class="chat-form" style="display:none"><textarea id="messageInput" placeholder="Write a message…" rows="1" maxlength="4000"></textarea><button class="btn primary" type="submit">Send</button></form></section>
</div></div></main>
<script>
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);let currentUser=null,currentConversation=null,globalChannel=null,conversationCache=[];
function formatTime(value){if(!value)return'';return new Date(value).toLocaleString('en-OM',{dateStyle:'medium',timeStyle:'short'});}function shortTime(value){if(!value)return'';const d=new Date(value),now=new Date();const same=d.toDateString()===now.toDateString();return same?d.toLocaleTimeString('en-OM',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-OM',{month:'short',day:'numeric'});}function initials(name){const parts=String(name||'User').trim().split(/\s+/).filter(Boolean);return esc((parts[0]?.[0]||'U')+(parts.length>1?(parts[parts.length-1]?.[0]||''):'')).toUpperCase();}
function avatarHtml(profile,cls='conversation-avatar'){const name=profile?.full_name||profile?.username||'User';return profile?.avatar_url?`<div class="${cls}"><img src="${esc(profile.avatar_url)}" alt="${esc(name)}"></div>`:`<div class="${cls}">${initials(name)}</div>`;}
async function loadConversations(){
 const {data,error}=await sb.from('conversations').select('id,listing_id,auction_id,buyer_id,seller_id,created_at').or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`).order('created_at',{ascending:false});
 if(error){$('conversationList').innerHTML='<div class="empty-chat">Could not load messages.<br><small>'+esc(error.message)+'</small></div>';return;}
 conversationCache=data||[];if(!conversationCache.length){$('conversationList').innerHTML='<div class="empty-chat">No conversations yet.<br>Open an ad and click “Contact seller”.</div>';$('totalUnread').style.display='none';return;}
 const otherIds=[...new Set(conversationCache.map(c=>c.buyer_id===currentUser.id?c.seller_id:c.buyer_id).filter(Boolean))];const listingIds=[...new Set(conversationCache.map(c=>c.listing_id).filter(Boolean))];const auctionIds=[...new Set(conversationCache.map(c=>c.auction_id).filter(Boolean))];const conversationIds=conversationCache.map(c=>c.id);
 const [{data:profiles},{data:listings},{data:auctions},{data:messages}]=await Promise.all([
   otherIds.length?sb.from('public_profiles').select('id,full_name,username,avatar_url').in('id',otherIds):Promise.resolve({data:[]} ),
   listingIds.length?sb.from('listings').select('id,title').in('id',listingIds):Promise.resolve({data:[]} ),
   auctionIds.length?sb.from('auctions').select('id,title').in('id',auctionIds):Promise.resolve({data:[]} ),
   conversationIds.length?sb.from('messages').select('conversation_id,message,created_at,sender_id,is_read').in('conversation_id',conversationIds).order('created_at',{ascending:false}):Promise.resolve({data:[]} )
 ]);
 const profileMap=Object.fromEntries((profiles||[]).map(p=>[p.id,p]));const listingMap=Object.fromEntries((listings||[]).map(x=>[x.id,x.title]));const auctionMap=Object.fromEntries((auctions||[]).map(x=>[x.id,x.title]));const lastMap={},unreadMap={};(messages||[]).forEach(m=>{if(!lastMap[m.conversation_id])lastMap[m.conversation_id]=m;if(m.sender_id!==currentUser.id&&!m.is_read)unreadMap[m.conversation_id]=(unreadMap[m.conversation_id]||0)+1;});
 const totalUnread=Object.values(unreadMap).reduce((a,b)=>a+b,0);$('totalUnread').textContent=totalUnread;$('totalUnread').style.display=totalUnread?'inline-flex':'none';
 $('conversationList').innerHTML=conversationCache.map(c=>{const otherId=c.buyer_id===currentUser.id?c.seller_id:c.buyer_id;const p=profileMap[otherId]||{};const last=lastMap[c.id];const name=p.full_name||p.username||'User';const context=c.listing_id?(listingMap[c.listing_id]||'Listing'):c.auction_id?(auctionMap[c.auction_id]||'Auction'):'Conversation';const count=unreadMap[c.id]||0;const active=currentConversation===c.id?' active':'';return `<button class="conversation-item${active}" data-id="${esc(c.id)}">${avatarHtml(p)}<div class="conversation-main"><div class="conversation-top"><strong>${esc(name)}</strong><span class="conversation-time">${shortTime(last?.created_at||c.created_at)}</span>${count?`<span class="unread-badge conversation-unread">${count>99?'99+':count}</span>`:''}</div><small>${esc(context)}</small><small class="preview">${esc(last?.message||'No messages yet')}</small></div></button>`;}).join('');
 document.querySelectorAll('.conversation-item').forEach(btn=>btn.addEventListener('click',()=>openConversation(btn.dataset.id)));
}
async function openConversation(id){const conversation=conversationCache.find(c=>c.id===id);if(!conversation)return;currentConversation=id;history.replaceState(null,'','messages.html?conversation='+encodeURIComponent(id));const otherId=conversation.buyer_id===currentUser.id?conversation.seller_id:conversation.buyer_id;const [{data:profile},{data:listing},{data:auction}]=await Promise.all([sb.from('public_profiles').select('full_name,username,avatar_url').eq('id',otherId).maybeSingle(),conversation.listing_id?sb.from('listings').select('id,title').eq('id',conversation.listing_id).maybeSingle():Promise.resolve({data:null}),conversation.auction_id?sb.from('auctions').select('id,title').eq('id',conversation.auction_id).maybeSingle():Promise.resolve({data:null})]);const name=profile?.full_name||profile?.username||'User';const context=listing?.title||auction?.title||'';$('chatHead').innerHTML=`${avatarHtml(profile,'chat-avatar')}<div class="chat-title"><h2>${esc(name)}</h2><p>${context?`<a class="listing-link" href="${conversation.listing_id?'listing.html?id='+encodeURIComponent(conversation.listing_id):'auctions.html'}">${esc(context)}</a>`: 'Conversation'}</p></div>`;$('chatForm').style.display='flex';await loadMessages();await markMessagesRead();await loadConversations();subscribeToMessages();$('messageInput').focus();}
async function loadMessages(){if(!currentConversation)return;const {data,error}=await sb.from('messages').select('id,sender_id,message,is_read,created_at').eq('conversation_id',currentConversation).order('created_at',{ascending:true});if(error){$('chatMessages').innerHTML='<div class="empty-chat">'+esc(error.message)+'</div>';return;}if(!data?.length){$('chatMessages').innerHTML='<div class="empty-chat">No messages yet. Say hello 👋</div>';return;}$('chatMessages').innerHTML=data.map(m=>{const mine=m.sender_id===currentUser.id;return `<div class="bubble ${mine?'mine':'theirs'}">${esc(m.message)}<time>${formatTime(m.created_at)}</time></div>`;}).join('');const box=$('chatMessages');box.scrollTop=box.scrollHeight;}
async function markMessagesRead(){if(!currentConversation)return;await sb.from('messages').update({is_read:true}).eq('conversation_id',currentConversation).neq('sender_id',currentUser.id).eq('is_read',false);}
async function sendMessage(text){if(!currentConversation||!text.trim())return;const {error}=await sb.from('messages').insert({conversation_id:currentConversation,sender_id:currentUser.id,message:text.trim()});if(error){alert('Could not send message: '+error.message);return;}$('messageInput').value='';await loadMessages();await loadConversations();}
function subscribeToMessages(){if(globalChannel)sb.removeChannel(globalChannel);globalChannel=sb.channel('user-messages-'+currentUser.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async payload=>{if(payload.new?.conversation_id===currentConversation){await loadMessages();await markMessagesRead();}await loadConversations();}).subscribe();}
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();await sendMessage($('messageInput').value);});$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chatForm').requestSubmit();}});
(async()=>{currentUser=await BingoAuth.getUser();if(!currentUser){location.href='login.html?next='+encodeURIComponent(location.href);return;}await loadConversations();subscribeToMessages();const requested=params.get('conversation');if(requested&&conversationCache.some(c=>c.id===requested))await openConversation(requested);})();
</script></body></html>
