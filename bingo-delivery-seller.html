<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingo Seller Delivery</title>
<link rel="stylesheet" href="bingo-delivery.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
<style>.seller-orders{display:grid;gap:12px}.seller-order{border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:14px;background:#fff}.seller-order-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.seller-items{margin:10px 0;padding:0 18px}.seller-actions{display:flex;gap:8px;flex-wrap:wrap}.seller-error{padding:12px;border-radius:10px;background:#fff1f1;color:#a00}.seller-login{display:flex;gap:10px;align-items:center}.seller-muted{opacity:.7}</style>
</head>
<body>
<header class="bd-topbar"><div class="bd-brand">BINGO Seller<small data-bd-i18n="seller">البائع</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html" data-bd-i18n="customer">العميل</a><a href="bingo-delivery-driver.html" data-bd-i18n="driver">المندوب</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="#" data-bd-language>EN</a><span id="seller-user" class="seller-muted"></span></nav></header>
<main class="bd-main">
<div class="bd-grid cards">
<section class="bd-card"><div class="bd-muted">طلب جديد</div><div id="count-pending" class="bd-stat">0</div></section>
<section class="bd-card"><div class="bd-muted">قيد التجهيز</div><div id="count-preparing" class="bd-stat">0</div></section>
<section class="bd-card"><div class="bd-muted">قيد التوصيل</div><div id="count-delivery" class="bd-stat">0</div></section>
</div>
<section class="bd-card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>الطلبات</h2><button id="refresh-orders" class="bd-btn ghost" type="button">تحديث</button></div><div id="seller-message" class="seller-muted"></div><div id="seller-orders" class="seller-orders"><p>جاري تحميل الطلبات...</p></div></section>
</main>
<script>
(function(){'use strict';
const sb=window.supabaseClient||window.sb||window.supabase;let stores=[],orders=[];
const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const statusLabel=s=>({pending:'طلب جديد',preparing:'قيد التجهيز',ready:'جاهز للاستلام',assigned:'تم طلب مندوب',picked_up:'تم الاستلام',on_delivery:'قيد التوصيل',delivered:'تم التسليم',cancelled:'ملغي'}[s]||s);
function render(){document.querySelector('#count-pending').textContent=orders.filter(o=>o.status==='pending').length;document.querySelector('#count-preparing').textContent=orders.filter(o=>o.status==='preparing').length;document.querySelector('#count-delivery').textContent=orders.filter(o=>['assigned','picked_up','on_delivery'].includes(o.status)).length;const el=document.querySelector('#seller-orders');if(!orders.length){el.innerHTML='<p>لا توجد طلبات لهذا المتجر حاليًا.</p>';return}el.innerHTML=orders.map(o=>{const items=o.items||[];let action='';if(o.status==='pending')action=`<button class="bd-btn orange" data-status="preparing" data-id="${o.id}">بدء التجهيز</button>`;else if(o.status==='preparing')action=`<button class="bd-btn orange" data-status="ready" data-id="${o.id}">الطلب جاهز</button><button class="bd-btn" data-status="assigned" data-id="${o.id}">طلب مندوب</button>`;return `<article class="seller-order"><div class="seller-order-head"><strong>${esc(o.id)}</strong><span class="bd-badge warning">${esc(statusLabel(o.status))}</span></div><p>الإجمالي الفرعي: <strong>${Number(o.subtotal||0).toFixed(3)} OMR</strong> · التوصيل: <strong>${Number(o.delivery_fee||0).toFixed(3)} OMR</strong> · الإجمالي: <strong>${Number(o.total||0).toFixed(3)} OMR</strong></p><ul class="seller-items">${items.map(i=>`<li>${esc(i.description)} × ${i.quantity} — ${Number(i.unit_price||0).toFixed(3)} OMR</li>`).join('')}</ul><div class="seller-actions">${action}</div></article>`}).join('');el.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));}
async function load(){const msg=document.querySelector('#seller-message');if(!sb?.from){msg.textContent='Supabase غير متاح.';return}try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user){document.querySelector('#seller-orders').innerHTML='<p class="seller-error">يرجى تسجيل الدخول بحساب البائع.</p>';return}document.querySelector('#seller-user').textContent=user.email||'';let sr=await sb.from('delivery_stores').select('id,store_name,store_name_ar,store_name_en').eq('owner_id',user.id).eq('is_active',true);if(sr.error)throw sr.error;stores=sr.data||[];if(!stores.length){document.querySelector('#seller-orders').innerHTML='<p>لا يوجد متجر مرتبط بحساب البائع.</p>';render();return}const ids=stores.map(s=>s.id);let or=await sb.from('delivery_orders').select('id,store_id,customer_id,status,payment_status,delivery_address,subtotal,delivery_fee,total,created_at').in('store_id',ids).order('created_at',{ascending:false}).limit(50);if(or.error)throw or.error;orders=or.data||[];for(const o of orders){const ir=await sb.from('delivery_order_items').select('description,quantity,unit_price,product_id').eq('order_id',o.id);o.items=ir.error?[]:(ir.data||[])}render();msg.textContent=`${orders.length} طلب`; }catch(e){console.error('Seller orders:',e);msg.innerHTML='<span class="seller-error">تعذر تحميل طلبات التوصيل. تحقق من RLS وConsole.</span>';document.querySelector('#seller-orders').innerHTML='';}}
async function updateStatus(id,status){try{const {data,error}=await sb.rpc('delivery_store_set_order_status',{p_order_id:id,p_status:status});if(error)throw error;await load();}catch(e){console.error('Seller status:',e);alert('تعذر تحديث حالة الطلب: '+(e.message||e));}}
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#refresh-orders').onclick=load;load();});
})();
</script>
<script src="bingo-delivery.js"></script>
</body></html>
