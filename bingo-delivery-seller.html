<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Seller Delivery</title><link rel="stylesheet" href="bingo-delivery.css"></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Seller<small data-bd-i18n="seller">البائع</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html" data-bd-i18n="customer">العميل</a><a href="bingo-delivery-driver.html" data-bd-i18n="driver">المندوب</a><a href="bingo-delivery-admin.html" data-bd-i18n="admin">إدارة التوصيل</a><a href="javascript:BingoDelivery.setLang(BingoDelivery.getLang()==='ar'?'en':'ar')" data-bd-language>EN</a></nav></header><main class="bd-main"><div class="bd-grid cards"><section class="bd-card"><div class="bd-muted" data-bd-i18n="newOrder">طلب جديد</div><div class="bd-stat" id="seller-new-count">0</div></section><section class="bd-card"><div class="bd-muted" data-bd-i18n="preparing">قيد التجهيز</div><div class="bd-stat" id="seller-preparing-count">0</div></section><section class="bd-card"><div class="bd-muted" data-bd-i18n="onDelivery">قيد التوصيل</div><div class="bd-stat" id="seller-delivery-count">0</div></section></div><section class="bd-card" style="margin-top:18px"><h2 data-bd-i18n="orders">الطلبات</h2><div class="bd-list" id="seller-orders"><p data-bd-i18n="noOrders">لا توجد طلبات</p></div></section></main><script src="bingo-delivery.js"></script><script>
(function(){
 const sb=window.supabaseClient||window.supabase;
 const host=document.getElementById('seller-orders');
 async function load(){if(!sb?.from)return;const {data,error}=await sb.from('delivery_orders').select('id,order_number,status,total,delivery_address,created_at').order('created_at',{ascending:false}).limit(50);if(error){console.error(error);return}const c={pending:0,preparing:0,on_delivery:0};data.forEach(o=>{if(o.status==='pending'||o.status==='confirmed')c.pending++;if(o.status==='preparing')c.preparing++;if(o.status==='on_delivery'||o.status==='assigned'||o.status==='picked_up')c.on_delivery++});document.getElementById('seller-new-count').textContent=c.pending;document.getElementById('seller-preparing-count').textContent=c.preparing;document.getElementById('seller-delivery-count').textContent=c.on_delivery;host.innerHTML=data.length?data.map(o=>{const next=o.status==='pending'||o.status==='confirmed'?'preparing':o.status==='preparing'?'ready':null;return `<div class="bd-row"><div><strong>${o.order_number}</strong><div class="bd-muted">${o.delivery_address||''} · ${Number(o.total||0).toFixed(3)} OMR</div></div><span class="bd-badge ${o.status==='delivered'?'success':'warning'}">${BingoDelivery.t(o.status)||o.status}</span>${next?`<button class="bd-btn orange" data-delivery-action="seller-status" data-status="${next}" data-order-id="${o.id}">${next==='preparing'?BingoDelivery.t('accept')+' / '+BingoDelivery.t('preparing'):BingoDelivery.t('ready')}</button>`:''}</div>`}).join(''):`<p>${BingoDelivery.t('noOrders')}</p>`}
 load(); if(sb?.channel)sb.channel('seller-live').on('postgres_changes',{event:'*',schema:'public',table:'delivery_orders'},load).subscribe();
})();</script></body></html>
