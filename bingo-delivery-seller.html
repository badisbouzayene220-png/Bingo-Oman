<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Seller Delivery</title><link rel="stylesheet" href="bingo-delivery.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><style>.seller-orders{display:grid;gap:12px}.seller-order{border:1px solid rgba(0,0,0,.1);border-radius:14px;padding:14px;background:#fff}.seller-order-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.seller-items{margin:10px 0;padding:0 18px}.seller-actions{display:flex;gap:8px;flex-wrap:wrap}.seller-error{padding:12px;border-radius:10px;background:#fff1f1;color:#a00}.seller-login{max-width:440px;margin:40px auto}.seller-login form{display:grid;gap:12px}.seller-login input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.seller-login label{display:grid;gap:6px;font-weight:600}.seller-muted{opacity:.7}.seller-userbar{display:flex;align-items:center;gap:10px}.seller-store{font-size:.9rem;opacity:.75}.seller-success{padding:12px;border-radius:10px;background:#effaf1;color:#176b2c}.seller-hidden{display:none!important}</style></head><body><header class="bd-topbar"><div class="bd-brand">BINGO Seller<small>البائع</small></div><nav class="bd-nav"><a href="bingo-delivery-customer.html">العميل</a><a href="bingo-delivery-driver.html">المندوب</a><a href="bingo-delivery-admin.html">إدارة التوصيل</a><a href="#" data-bd-language>EN</a><span id="seller-user" class="seller-userbar seller-muted"></span></nav></header><main class="bd-main"><section id="seller-login" class="bd-card seller-login seller-hidden"><h2>دخول البائع</h2><p class="seller-muted">سجّل الدخول بحساب البائع المرتبط بالمتجر.</p><form id="seller-login-form"><label>البريد الإلكتروني<input id="seller-email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="seller-password" type="password" autocomplete="current-password" required></label><button class="bd-btn orange" type="submit">تسجيل الدخول</button><div id="seller-login-message" role="alert"></div></form></section><section id="seller-app" class="seller-hidden"><div class="bd-grid cards"><section class="bd-card"><div class="bd-muted">طلب جديد</div><div id="count-pending" class="bd-stat">0</div></section><section class="bd-card"><div class="bd-muted">قيد التجهيز</div><div id="count-preparing" class="bd-stat">0</div></section><section class="bd-card"><div class="bd-muted">قيد التوصيل</div><div id="count-delivery" class="bd-stat">0</div></section></div><section class="bd-card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h2>الطلبات</h2><div id="seller-store" class="seller-store"></div></div><div style="display:flex;gap:8px"><button id="refresh-orders" class="bd-btn ghost" type="button">تحديث</button><button id="seller-logout" class="bd-btn ghost" type="button">خروج</button></div></div><div id="seller-message" class="seller-muted"></div><div id="seller-orders" class="seller-orders"><p>جاري تحميل الطلبات...</p></div></section></section></main><script>(function(){'use strict';const sb=window.sb;let stores=[],orders=[],loading=false;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));const statusLabel=s=>({pending:'طلب جديد',preparing:'قيد التجهيز',ready:'جاهز للاستلام',assigned:'تم طلب مندوب',picked_up:'تم الاستلام',on_delivery:'قيد التوصيل',delivered:'تم التسليم',cancelled:'ملغي'}[s]||s);function showLogin(message=''){$('seller-login').classList.remove('seller-hidden');$('seller-app').classList.add('seller-hidden');if(message)$('seller-login-message').textContent=message}function showApp(){$('seller-login').classList.add('seller-hidden');$('seller-app').classList.remove('seller-hidden')}async function getSessionUser(){const {data,error}=await sb.auth.getSession();if(error)throw error;return data?.session?.user||null}function render(){$('count-pending').textContent=orders.filter(o=>o.status==='pending').length;$('count-preparing').textContent=orders.filter(o=>o.status==='preparing').length;$('count-delivery').textContent=orders.filter(o=>['assigned','picked_up','on_delivery'].includes(o.status)).length;const el=$('seller-orders');if(!orders.length){el.innerHTML='<p>لا توجد طلبات لهذا المتجر حاليًا.</p>';return}el.innerHTML=orders.map(o=>{const items=o.items||[];let action='';if(o.status==='pending')action=`<button class="bd-btn orange" data-status="preparing" data-id="${o.id}">بدء التجهيز</button>`;else if(o.status==='preparing')action=`<button class="bd-btn orange" data-status="ready" data-id="${o.id}">الطلب جاهز</button>`;else if(o.status==='ready')action=`<button class="bd-btn" data-driver="${o.id}">طلب مندوب</button>`;return `<article class="seller-order"><div class="seller-order-head"><strong>${esc(o.order_number||o.id)}</strong><span class="bd-badge warning">${esc(statusLabel(o.status))}</span></div><p>الإجمالي الفرعي: <strong>${Number(o.subtotal||0).toFixed(3)} OMR</strong> · التوصيل: <strong>${Number(o.delivery_fee||0).toFixed(3)} OMR</strong> · الإجمالي: <strong>${Number(o.total||0).toFixed(3)} OMR</strong></p><ul class="seller-items">${items.map(i=>`<li>${esc(i.description)} × ${i.quantity} — ${Number(i.unit_price||0).toFixed(3)} OMR</li>`).join('')}</ul><div class="seller-actions">${action}</div></article>`}).join('');el.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));el.querySelectorAll('[data-driver]').forEach(b=>b.onclick=()=>requestDriver(b.dataset.driver))}async function load(){if(loading)return;loading=true;const msg=$('seller-message');try{const user=await getSessionUser();if(!user){showLogin();msg.textContent='';return}$('seller-user').textContent=user.email||'';const sr=await sb.from('delivery_stores').select('id,store_name,store_name_ar,store_name_en').eq('owner_id',user.id).eq('is_active',true);if(sr.error)throw sr.error;stores=sr.data||[];if(!stores.length){showApp();$('seller-store').textContent='لا يوجد متجر نشط مرتبط بهذا الحساب.';$('seller-orders').innerHTML='<p class="seller-error">هذا الحساب لا يملك متجرًا مرتبطًا.</p>';return}showApp();$('seller-store').textContent='المتجر: '+(stores[0].store_name_ar||stores[0].store_name_en||stores[0].store_name||'');const ids=stores.map(s=>s.id);const or=await sb.from('delivery_orders').select('id,order_number,store_id,customer_id,status,payment_status,delivery_address,subtotal,delivery_fee,total,created_at').in('store_id',ids).order('created_at',{ascending:false}).limit(50);if(or.error)throw or.error;orders=or.data||[];for(const o of orders){const ir=await sb.from('delivery_order_items').select('description,quantity,unit_price,product_id').eq('order_id',o.id);o.items=ir.error?[]:(ir.data||[])}render();msg.textContent=`${orders.length} طلب`;}catch(e){console.error('Seller orders:',e);const text=e.message||String(e);if(/auth session missing|jwt|authentication required/i.test(text))showLogin('انتهت جلسة البائع. سجّل الدخول مرة أخرى.');else{showApp();msg.innerHTML='<span class="seller-error">تعذر تحميل طلبات التوصيل: '+esc(text)+'</span>'}}finally{loading=false}}async function login(e){e.preventDefault();const msg=$('seller-login-message'),email=$('seller-email').value.trim(),password=$('seller-password').value;msg.textContent='جاري تسجيل الدخول...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.innerHTML='<span class="seller-error">فشل تسجيل الدخول: '+esc(error.message)+'</span>';return}$('seller-password').value='';await new Promise(r=>setTimeout(r,200));await load()}async function logout(){await sb.auth.signOut();stores=[];orders=[];$('seller-user').textContent='';showLogin()}async function updateStatus(id,status){try{const {error}=await sb.rpc('delivery_store_set_order_status',{p_order_id:id,p_status:status});if(error)throw error;await load()}catch(e){alert('تعذر تحديث حالة الطلب: '+(e.message||e))}}async function requestDriver(id){const btn=document.querySelector(`[data-driver="${CSS.escape(id)}"]`);if(btn){btn.disabled=true;btn.textContent='جاري طلب المندوب...'}try{const {data,error}=await sb.rpc('delivery_store_request_driver',{p_order_id:id});if(error)throw error;if(!data)throw new Error('لم يتم إنشاء طلب المندوب');$('seller-message').innerHTML='<span class="seller-success">تم طلب المندوب بنجاح.</span>';await load()}catch(e){if(btn){btn.disabled=false;btn.textContent='طلب مندوب'}alert('تعذر طلب المندوب: '+(e.message||e))}}document.addEventListener('DOMContentLoaded',()=>{$('seller-login-form').addEventListener('submit',login);$('refresh-orders').onclick=load;$('seller-logout').onclick=logout;load();sb.auth.onAuthStateChange(event=>{if(['SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED','USER_UPDATED'].includes(event))setTimeout(()=>load(),300)})})})();</script><script src="bingo-delivery.js"></script><script src="bingo-seller-dashboard-v2.js?v=20260822-1"></script></body></html>
