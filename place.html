  "al-batinah-north": {"ar":{"title":"شمال الباطنة","subtitle":"ساحل نابض بالتجارة والتراث والأنشطة البحرية","region":"محافظة شمال الباطنة","type":"محافظة","facts":["سبع ولايات تجمع بين الساحل والجبال","صحار مركز تاريخي واقتصادي مهم","حصون وأسواق ومواقع تراثية متعددة","ميناء صحار ومنطقة صحار الحرة من أبرز المراكز الاقتصادية"],"intro":"تمتد محافظة شمال الباطنة على الساحل الشمالي لعُمان، وتجمع بين السهل الساحلي والجبال والقرى والأسواق. وتوفر مزيجًا من التراث البحري والتاريخي والأنشطة الطبيعية، إلى جانب دور اقتصادي مهم في الصناعة واللوجستيات.","highlights":["تضم ولايات صحار وشناص ولوى وصحم والخابورة والسويق وغيرها من الوجهات الساحلية.","يبرز حصنا صحار وشناص ضمن المعالم التاريخية، بينما توفر الأودية والمناطق الجبلية فرصًا للاستكشاف.","يمثل ميناء صحار ومنطقة صحار الحرة جزءًا مهمًا من البنية الاقتصادية واللوجستية للمحافظة."],"source":"تجربة عُمان — محافظة شمال الباطنة"},"en":{"title":"North Al Batinah","subtitle":"A vibrant coast shaped by trade, heritage and marine activities","region":"North Al Batinah Governorate","type":"Governorate","facts":["Seven wilayats combining coast and mountains","Sohar is a major historic and economic centre","Forts, souqs and heritage sites","Sohar Port and Freezone are major economic hubs"],"intro":"North Al Batinah stretches along Oman's northern coast and combines coastal plains, mountains, villages and markets. It offers maritime and heritage experiences alongside an important industrial and logistics role.","highlights":["The governorate includes Sohar, Shinas, Liwa, Saham, Al Khaburah and Al Suwaiq among its coastal wilayats.","Sohar and Shinas forts are notable heritage landmarks, while wadis and mountain areas add outdoor experiences.","Sohar Port and Freezone form an important part of the governorate's industrial and logistics economy."],"source":"Experience Oman — North Al Batinah"}},
  "al-batinah-south": {"ar":{"title":"جنوب الباطنة","subtitle":"حصون تاريخية وقرى جبلية وشواطئ وأنشطة بحرية","region":"محافظة جنوب الباطنة","type":"محافظة","facts":["تجمع الساحل والجبال والقرى الزراعية","الرستاق مركز تاريخي بارز","حصن نخل وحصن الحزم من أبرز المعالم","جزر الديمانيات والسوادي للأنشطة البحرية"],"intro":"تجمع محافظة جنوب الباطنة بين التاريخ والطبيعة والأنشطة البحرية. وتتميز بولايات تاريخية مثل الرستاق ونخل، وبقرى جبلية ومدرجات زراعية وشواطئ وجزر قريبة من الساحل.","highlights":["تشتهر الرستاق بقلعتها وعين الكسفة، بينما يقع حصن نخل فوق كتلة صخرية قرب عين الثوارة.","تقدم قرى وادي المعاول والعوابي ووكان مشاهد جبلية وزراعية مميزة.","تعد شواطئ السوادي وجزر الديمانيات من الوجهات المهمة للرحلات البحرية والغوص."],"source":"تجربة عُمان — محافظة جنوب الباطنة"},"en":{"title":"South Al Batinah","subtitle":"Historic forts, mountain villages, beaches and marine experiences","region":"South Al Batinah Governorate","type":"Governorate","facts":["A mix of coast, mountains and agricultural villages","Rustaq is a major historic centre","Nakhal and Al Hazm are key heritage landmarks","Daymaniyat Islands and Al Sawadi offer marine activities"],"intro":"South Al Batinah combines history, nature and marine activities. Historic wilayats such as Rustaq and Nakhal sit alongside mountain villages, agricultural terraces, beaches and offshore islands.","highlights":["Rustaq is known for its fort and Ain Al Kasfa, while Nakhal Fort rises above a rocky outcrop near Ain Al Thawarah.","Villages in Wadi Al Maawil, Al Awabi and Wakan offer distinctive mountain and agricultural scenery.","Al Sawadi and the Daymaniyat Islands are important destinations for boat trips, diving and marine exploration."],"source":"Experience Oman — South Al Batinah"}},
  "al-dhahirah": {"ar":{"title":"الظاهرة","subtitle":"تراث أثري وجبال ووديان وصحراء في شمال غرب عُمان","region":"محافظة الظاهرة","type":"محافظة","facts":["تضم ولايات عبري وضنك وينقل","مواقع بات والخطم والعين الأثرية مدرجة ضمن قائمة التراث العالمي","محمية نجوم هاجر الغربية للسماء والجبال","تجمع الجبال والأودية والصحراء"],"intro":"تقع الظاهرة في شمال غرب سلطنة عُمان، وتقدم مزيجًا من التراث العريق والمناظر الطبيعية والثقافة المحلية. وتعد عبري مركزًا مهمًا للتراث والطرق البرية، بينما تمنح الجبال والأودية والصحراء المنطقة طابعًا متنوعًا.","highlights":["تضم المواقع الأثرية في بات والخطم والعين عناصر مهمة من التراث العالمي.","توفر محمية نجوم هاجر الغربية بيئة مناسبة لمراقبة النجوم واستكشاف التضاريس الجبلية.","تقدم أودية ضنك وينقل وامتدادات الصحراء تجارب للمشي والاستكشاف والطبيعة."],"source":"تجربة عُمان — محافظة الظاهرة"},"en":{"title":"Al Dhahirah","subtitle":"Archaeological heritage, mountains, wadis and desert in northwestern Oman","region":"Al Dhahirah Governorate","type":"Governorate","facts":["Home to Ibri, Dhank and Yanqul","Bat, Al Khutm and Al Ayn archaeological sites are UNESCO-listed","Western Hajar Stars Light Reserve","A varied mix of mountains, wadis and desert"],"intro":"Al Dhahirah in northwestern Oman combines deep heritage with varied landscapes and local culture. Ibri is a major centre for history and overland routes, while mountains, wadis and desert give the governorate its distinctive character.","highlights":["The archaeological sites of Bat, Al Khutm and Al Ayn form an important UNESCO World Heritage complex.","The Western Hajar Stars Light Reserve provides opportunities for stargazing and high-altitude exploration.","Wadis around Dhank and Yanqul and the desert landscapes support hiking, nature and adventure experiences."],"source":"Experience Oman — Al Dhahirah"}},
  "al-buraimi": {"ar":{"title":"البريمي","subtitle":"واحات وتاريخ تجاري ومعالم تراثية عند بوابة عُمان الغربية","region":"محافظة البريمي","type":"محافظة","facts":["موقع استراتيجي للتجارة والعبور","تجمع الجبال والسهول والصحراء","حصون وأفلاج وقرى تاريخية","ولاية محضة جزء من تنوع المحافظة الطبيعي"],"intro":"تتمتع محافظة البريمي بموقع استراتيجي في شمال غرب عُمان، وتجمع بين النشاط التجاري والزراعة والسياحة. وتظهر هويتها في الحصون القديمة والأفلاج والقرى والأسواق، إلى جانب المناظر الجبلية والصحراوية.","highlights":["من معالمها حصن الحلة وحصن الخندق وحصن مرجب، إضافة إلى مواقع تاريخية في حماسة ومحضة.","تظهر الأفلاج مثل فلج الصعرة وفلج محضة أهمية أنظمة الري التقليدية في الحياة المحلية.","تمنح الجبال والسهول والمناطق الصحراوية فرصًا للتصوير والاستكشاف والتجارب الثقافية."],"source":"تجربة عُمان — محافظة البريمي"},"en":{"title":"Al Buraimi","subtitle":"Oases, trading heritage and historic landmarks at Oman's western gateway","region":"Al Buraimi Governorate","type":"Governorate","facts":["A strategic centre for trade and movement","Mountains, plains and desert landscapes","Historic forts, aflaj and villages","Mahdah adds to the governorate's natural diversity"],"intro":"Al Buraimi occupies a strategic position in northwestern Oman and combines trade, agriculture and tourism. Its identity is reflected in historic forts, aflaj, villages and markets, alongside mountain and desert landscapes.","highlights":["Landmarks include Al Hillah, Al Khandak and Murajib forts, as well as heritage sites in Hamasa and Mahdah.","Aflaj such as Sa'arah and Mahdah illustrate the importance of traditional irrigation systems in local life.","Mountains, plains and desert areas provide opportunities for photography, exploration and cultural experiences."],"source":"Experience Oman — Al Buraimi"}},
  "north-al-sharqiyah": {"ar":{"title":"شمال الشرقية","subtitle":"رمال ذهبية وأودية وواحات وقرى جبلية","region":"محافظة شمال الشرقية","type":"محافظة","facts":["تضم ولايات ووجهات داخلية متنوعة","وادي بني خالد من أشهر الأودية","رمال الشرقية وجهة للتخييم والمغامرات","مزيج من الواحات والجبال والصحراء"],"intro":"تتميز شمال الشرقية بتنوع واضح بين الأودية والواحات والقرى الجبلية والصحراء. وتعد وادي بني خالد ورمال الشرقية من أبرز الوجهات التي تجمع الطبيعة والمغامرة والهدوء.","highlights":["يضم وادي بني خالد بركًا طبيعية وممرات بين جبال الحجر، ويصل إلى قرية مقل وكهفها.","تشتهر رمال الشرقية بالكثبان الذهبية الواسعة وتجارب التخييم والرحلات الصحراوية.","تنتشر القرى والواحات التي تعكس الزراعة التقليدية ونمط الحياة المحلي."],"source":"تجربة عُمان — شمال الشرقية"},"en":{"title":"North Al Sharqiyah","subtitle":"Golden sands, wadis, oases and mountain villages","region":"North Al Sharqiyah Governorate","type":"Governorate","facts":["A diverse set of inland wilayats and destinations","Wadi Bani Khalid is a major natural attraction","A'Sharqiyah Sands for camping and adventure","Oases, mountains and desert landscapes"],"intro":"North Al Sharqiyah offers a varied landscape of wadis, oases, mountain villages and desert. Wadi Bani Khalid and A'Sharqiyah Sands are among its best-known destinations for nature, adventure and relaxation.","highlights":["Wadi Bani Khalid features natural pools and pathways through the Eastern Al Hajar Mountains, extending toward Muqal and its cave.","A'Sharqiyah Sands is known for broad golden dunes and desert camping and excursion experiences.","Oases and villages preserve agricultural traditions and local ways of life."],"source":"Experience Oman — North Al Sharqiyah"}},
  "musandam": {"ar":{"title":"مسندم","subtitle":"جبال شاهقة وخُلجان بحرية ومغامرات على مضيق هرمز","region":"محافظة مسندم","type":"محافظة","facts":["تطل على بحر عُمان والخليج ومضيق هرمز","تضم خصب وبخاء ودبا ومدحاء","رحلات الداو والبحر من أشهر التجارب","غوص ومشي جبلي ومواقع تراثية"],"intro":"تشتهر مسندم بتضاريسها الجبلية الحادة التي تلتقي بالبحر، وبخلجانها العميقة وإطلالاتها على مضيق هرمز. وتجمع المحافظة بين الرحلات البحرية والجبال والغوص والتراث المحلي.","highlights":["خصب معروفة بحصنها ورحلات القوارب التقليدية في الخلجان البحرية.","تتميز بخاء بالشواطئ، بينما تجمع دبا بين الجبال والساحل، وتشتهر مدحاء بالأودية والينابيع.","يمكن الوصول إلى مسندم برًا وبحرًا وجوًا، ما يجعلها وجهة مناسبة للمغامرات والطبيعة."],"source":"تجربة عُمان — محافظة مسندم"},"en":{"title":"Musandam","subtitle":"Dramatic mountains, fjords and adventures on the Strait of Hormuz","region":"Musandam Governorate","type":"Governorate","facts":["Overlooks the Sea of Oman, Gulf and Strait of Hormuz","Includes Khasab, Bukha, Dibba and Madha","Traditional dhow and boat trips are major experiences","Diving, hiking and heritage sites"],"intro":"Musandam is known for steep mountains meeting the sea, dramatic fjords and views across the Strait of Hormuz. The governorate combines boat trips, mountain experiences, diving and local heritage.","highlights":["Khasab is known for its fort and traditional boat trips through the coastal fjords.","Bukha features beaches, while Dibba combines mountain and coastal scenery and Madha is known for valleys and springs.","Musandam can be reached by land, sea and air, making it a strong destination for adventure and nature."],"source":"Experience Oman — Musandam"}},
  "al-wusta": {"ar":{"title":"الوسطى","subtitle":"سواحل واسعة وصحراء ووجهات طبيعية بعيدة عن الزحام","region":"محافظة الوسطى","type":"محافظة","facts":["تقع في قلب عُمان وتمتد على ساحل بحر العرب","الدقم مركز اقتصادي وساحلي مهم","بر الحكمان محطة مهمة للطيور والحياة البحرية","شواطئ وصحارى ومواقع طبيعية متنوعة"],"intro":"تقع محافظة الوسطى في قلب سلطنة عُمان وتتميز بمساحات مفتوحة وساحل طويل على بحر العرب. وتجمع بين الاقتصاد والصناعة في الدقم وبين الشواطئ والجزر والمناطق الصحراوية التي تناسب محبي الطبيعة والاستكشاف.","highlights":["تضم الدقم مرافق اقتصادية وساحلية، إضافة إلى حديقة الصخور وشاطئ الدقم.","يعد بر الحكمان من المواقع المهمة للطيور المهاجرة والحياة البحرية، وتوجد شعاب مرجانية مناسبة للغوص.","تقدم محوت والجزيرة والمناطق الساحلية الأخرى مشاهد تجمع الكثبان والبحر والطيور."],"source":"تجربة عُمان — محافظة الوسطى"},"en":{"title":"Al Wusta","subtitle":"Open coastlines, desert landscapes and remote natural destinations","region":"Al Wusta Governorate","type":"Governorate","facts":["In central Oman along the Arabian Sea","Duqm is a major economic and coastal hub","Bar Al Hikman is important for migratory birds and marine life","A varied mix of beaches, desert and natural landscapes"],"intro":"Al Wusta sits in central Oman and is defined by wide open spaces and a long Arabian Sea coastline. It combines Duqm's economic and coastal role with beaches, islands and desert landscapes suited to nature and exploration.","highlights":["Duqm offers economic infrastructure and coastal attractions including the Rock Garden and Duqm Beach.","Bar Al Hikman is an important site for migratory birds and marine life, with offshore coral reefs attracting divers.","Mahout and other coastal areas offer scenery where dunes, sea and bird habitats meet."],"source":"Experience Oman — Al Wusta"}}
};

const key = new URLSearchParams(location.search).get("place") || "muscat";
const place = places[key];
const app = document.getElementById("placeApp");

function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function lang(){return (window.BingoLang && window.BingoLang.get()) || localStorage.getItem("bingo-language") || "ar";}

function render(){
  if(!place){
    app.innerHTML=`<section class="place-notfound place-wrap"><h1>${lang()==="ar"?"المكان غير موجود":"Place not found"}</h1><p>${lang()==="ar"?"اختر وجهة من الصفحة الرئيسية.":"Choose a destination from the homepage."}</p><a class="place-back" href="index.html">${lang()==="ar"?"العودة للرئيسية":"Back to home"}</a></section>`;
    return;
  }
  const l=lang(), d=place[l];
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.title=`BINGO Oman — ${d.title}`;

  app.innerHTML=`
  <section class="place-hero">
    <img src="${esc(place.image)}" alt="${esc(d.title)}">
    <div class="place-hero-content">
      <span class="place-breadcrumb">🇴🇲 ${esc(d.region)} • ${esc(d.type)}</span>
      <h1>${esc(d.title)}</h1>
      <p>${esc(d.subtitle)}</p>
    </div>
  </section>
  <section class="place-wrap">
    <div class="place-nav">
      <a href="index.html">${l==="ar"?"← العودة إلى اكتشف عُمان":"← Back to Discover Oman"}</a>
      <a href="marketplace.html">${l==="ar"?"اذهب إلى السوق المحلي →":"Go to local marketplace →"}</a>
    </div>
    <div class="place-grid">
      <div>
        <article class="place-card">
          <h2>${l==="ar"?"عن ":"About "}${esc(d.title)}</h2>
          <p>${esc(d.intro)}</p>
          <h3>${l==="ar"?"أبرز ما يميز المكان":"Highlights"}</h3>
          <ul>${d.highlights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        </article>
        <article class="place-card">
          <h2>${l==="ar"?"معلومات موثوقة":"Trusted information"}</h2>
          <p>${l==="ar"
            ?"نريد في BINGO Oman أن تكون صفحة المكان أكثر من مجرد صورة؛ لذلك نعرض معلومات مختصرة قابلة للتحقق، مع إسنادها إلى مصادر رسمية أو سياحية موثوقة."
            :"At BINGO Oman, a place page should be more than a photo. We present concise, verifiable information and attribute it to official or trusted tourism sources."}</p>
        </article>
      </div>
      <aside>
        <article class="place-card">
          <h2>${l==="ar"?"حقائق سريعة":"Quick facts"}</h2>
          <div class="place-facts">${d.facts.map((x,i)=>`<div class="place-fact"><strong>${i+1}</strong><span>${esc(x)}</span></div>`).join("")}</div>
        </article>
        <article class="place-card place-source">
          <h2>${l==="ar"?"المصادر":"Sources"}</h2>
          <p><strong>${l==="ar"?"المصدر الرئيسي:":"Primary source:"}</strong><br>${esc(d.source)}</p>
          <p><a href="${esc(place.sourceUrl)}" target="_blank" rel="noopener">${l==="ar"?"قراءة المصدر الأصلي ↗":"Read original source ↗"}</a></p>
          ${place.museumUrl?`<p><a href="${esc(place.museumUrl)}" target="_blank" rel="noopener">${l==="ar"?"المتحف الوطني العُماني ↗":"National Museum of Oman ↗"}</a></p>`:""}
        </article>
        <div class="place-actions">
          <a class="place-market" href="marketplace.html">${l==="ar"?"تصفح السوق في عُمان":"Browse the Oman marketplace"}</a>
          <a class="place-back" href="index.html">${l==="ar"?"العودة":"Back"}</a>
        </div>
      </aside>
    </div>
    <nav class="place-all-areas" aria-label="${l==="ar"?"جميع مناطق عُمان":"All Oman areas"}">
      <div class="place-all-areas-head">
        <h2>${l==="ar"?"جميع مناطق عُمان":"All Oman areas"}</h2>
        <p>${l==="ar"?"انتقل مباشرة إلى أي محافظة أو منطقة أخرى.":"Jump directly to another governorate or area."}</p>
      </div>
      <div class="place-area-links">
        ${Object.keys(places).map(k=>{
          const pd=places[k][l];
          return `<a class="${k===key?"active":""}" href="place.html?place=${encodeURIComponent(k)}"><b>${esc(pd.title)}</b><span>${esc(pd.region)}</span></a>`;
        }).join("")}
      </div>
    </nav>
  </section>`;
  document.getElementById("footerText").textContent=l==="ar"
    ?"© BINGO Oman — معلومات الأماكن مبنية على مصادر رسمية موثوقة."
    :"© BINGO Oman — Place information is based on trusted official sources.";
}
function refreshAfterLanguage(){
  setTimeout(render,20);
}
document.addEventListener("DOMContentLoaded",()=>{
  render();
});
document.addEventListener("bingo-language-changed", render);
</script>
</body>
</html>
