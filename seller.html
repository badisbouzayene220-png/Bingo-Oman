<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller | BINGO Oman</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="seller-profile.css?v=20260821-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><script src="language.js"></script><link rel="stylesheet" href="global-banner.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><button class="hamb" onclick="document.querySelector('.navlinks').classList.toggle('open')">☰</button><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><div class="actions"></div></div></header><main class="pagebody"><div class="container"><a class="listing-back" href="marketplace.html">← Back to Marketplace</a><section id="sellerHead" class="panel seller-page-head">Loading seller…</section><div id="sellerListings" class="seller-listing-grid"></div><div id="sellerEmpty" class="panel" hidden>No published listings found.</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const uid=new URLSearchParams(location.search).get('user');const shortId=id=>String(id||'').replace(/-/g,'').slice(0,6).toUpperCase();(async()=>{if(!uid){location.href='marketplace.html';return}const {data,error}=await sb.from('listings').select('id,title,price,city,created_at,listing_images(image_url,sort_order)').eq('user_id',uid).eq('status','published').order('created_at',{ascending:false});if(error){document.getElementById('sellerHead').textContent=error.message;return}const code=shortId(uid);document.title='Seller '+code+' | BINGO Oman';document.getElementById('sellerHead').innerHTML=`<div class="seller-page-avatar">${esc(code.slice(0,2))}</div><div><h1>BINGO Seller</h1><p>Seller ID · ${esc(code)} · ${(data||[]).length} published listings</p></div>`;const box=document.getElementById('sellerListings');if(!(data||[]).length){document.getElementById('sellerEmpty').hidden=false;return}box.innerHTML=data.map(x=>{const imgs=(x.listing_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return `<a class="seller-listing-card" href="listing.html?id=${encodeURIComponent(x.id)}">${imgs[0]?`<img src="${esc(imgs[0].image_url)}" alt="${esc(x.title)}" loading="lazy">`:'<div class="seller-listing-placeholder">📦</div>'}<div class="seller-listing-body"><strong>${esc(x.title)}</strong><b>${Number(x.price||0).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</b><small>📍 ${esc(x.city||'Oman')}</small></div></a>`}).join('')})();</script></body></html>
