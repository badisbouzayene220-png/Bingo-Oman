<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Delivery Control</title><link rel="stylesheet" href="bingo-delivery.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js?v=control-1"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0}.control-shell{max-width:1500px;margin:auto;padding:18px}.control-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.control-top a{text-decoration:none}.admin-frame{width:100%;height:1050px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(11,31,58,.08)}#liveMap{height:460px;border-radius:16px;overflow:hidden;margin-top:14px}.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.map-status{margin-top:10px;color:#6b7280;font-size:13px}@media(max-width:700px){.admin-frame{height:1200px}#liveMap{height:360px}}</style></head><body><div class="control-shell"><div class="control-top"><div><h1 style="margin:0">BINGO Delivery Control</h1><div class="bd-muted">لوحة الإدارة + الخريطة الحية في صفحة واحدة</div></div><div class="bd-actions"><a class="bd-btn ghost" href="admin.html">← Admin Center</a><button class="bd-btn orange" id="refreshMap">تحديث الخريطة</button></div></div><section class="bd-card"><h2>لوحة إدارة التوصيل</h2><iframe class="admin-frame" src="bingo-delivery-admin.html?v=control-1" title="BINGO Delivery Admin"></iframe></section><section class="bd-card" style="margin-top:18px"><div class="control-top" style="margin:0"><div><h2 style="margin:0">خريطة المندوبين المباشرة</h2><div class="map-legend"><span>🟢 متاح</span><span>🟠 مشغول</span><span>⚫ Offline</span></div></div></div><div id="liveMap"></div><div id="mapStatus" class="map-status">جاري تحميل مواقع المندوبين...</div></section></div><script>(async()=>{const sb=window.sb;let map=L.map('liveMap').setView([23.5880,58.3829],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let layer=L.layerGroup().addTo(map);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){const status=document.getElementById('mapStatus');status.textContent='جاري تحديث الخريطة...';const {data,error}=await sb.rpc('admin_delivery_drivers_dashboard');if(error){status.textContent='تعذر تحميل مواقع المندوبين: '+error.message;return}let rows=data;if(typeof rows==='string'){try{rows=JSON.parse(rows)}catch{rows=[]}}rows=Array.isArray(rows)?rows:[];layer.clearLayers();const located=rows.filter(d=>d.latitude!=null&&d.longitude!=null);const bounds=[];located.forEach(d=>{const lat=Number(d.latitude),lng=Number(d.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const state=!d.is_online?'⚫ Offline':d.is_available?'🟢 متاح':'🟠 مشغول';const bg=!d.is_online?'#59636f':d.is_available?'#16834b':'#f28c28';const icon=L.divIcon({className:'',html:`<div style="width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:${bg};color:#fff;border:3px solid #fff;box-shadow:0 3px 12px #0004;font-size:20px">🛵</div>`,iconSize:[40,40],iconAnchor:[20,20]});L.marker([lat,lng],{icon}).addTo(layer).bindPopup(`<div dir="rtl"><b>${esc(d.display_name||'المندوب')}</b><br>${state}<br>${esc(d.phone||'')}<br>${lat.toFixed(5)}, ${lng.toFixed(5)}${d.current_order_number?`<br><b>الطلب: #${esc(d.current_order_number)}</b>`:''}</div>`);bounds.push([lat,lng])});if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:15});status.textContent=located.length?`يظهر ${located.length} مندوب/مندوبين لديهم موقع GPS.`:'لا توجد مواقع GPS متاحة حاليًا.';setTimeout(()=>map.invalidateSize(),100)}document.getElementById('refreshMap').onclick=refresh;await refresh();setInterval(refresh,15000)})()</script></body></html>
