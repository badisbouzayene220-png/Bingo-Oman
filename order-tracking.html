<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BINGO Oman | تتبع الطلب</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="bingo-delivery.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script>
<style>body{background:#f5f7fb}.track-wrap{max-width:920px;margin:0 auto;padding:30px 16px 60px}.track-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.track-card{background:#fff;border:1px solid #e3e8ef;border-radius:22px;padding:22px;box-shadow:0 10px 35px rgba(12,35,75,.06)}.track-title{margin:0;color:#092a82}.track-sub{opacity:.7;margin-top:6px}.track-stage{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:22px 0}.stage{height:8px;border-radius:99px;background:#e8edf4}.stage.on{background:#f28c18}.status-big{text-align:center;padding:24px 8px}.status-icon{font-size:52px}.status-big h2{margin:8px 0}.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{padding:16px;border:1px solid #edf0f4;border-radius:16px}.code{font-size:30px;font-weight:900;letter-spacing:5px;color:#092a82}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.track-grid{grid-template-columns:1fr}.track-stage{gap:4px}.track-head{align-items:flex-start;flex-direction:column}}</style>
</head><body>
<header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a href="store.html">Store</a><a href="orders.html">My Orders</a></nav><div class="actions"><a class="btn small" href="orders.html">طلباتي</a></div></div></header>
<main class="track-wrap"><div class="track-head"><div><h1 class="track-title">تتبع طلب BINGO</h1><div class="track-sub" id="track-ref">جاري تحميل الطلب…</div></div><a class="btn small" href="store.html">العودة للمتجر</a></div><section class="track-card"><div id="track-error"></div><div class="track-stage" id="track-stage"></div><div class="status-big"><div class="status-icon" id="status-icon">🛍️</div><h2 id="status-title">تم استلام طلبك</h2><p id="status-text">BINGO يتابع طلبك الآن.</p></div><div class="track-grid"><div class="mini"><b>🛵 التوصيل</b><p id="driver-info">سيظهر المندوب عند تعيينه.</p><div id="eta-info"></div></div><div class="mini"><b>🔐 BINGO Code</b><p>استخدم الرمز عند التسليم فقط.</p><div class="code" id="bingo-code">••••</div></div></div><div id="delivery-native" style="margin-top:16px"></div><div class="actions"><button class="btn primary" id="refresh-track" type="button">تحديث الحالة</button><a class="btn" href="orders.html">كل طلباتي</a></div></section></main>
<script src="bingo-delivery.js"></script><script src="bingo-delivery-customer-tracking.js?v=20260818-2215"></script><script src="bingo-delivery-customer-eta.js?v=20260818-2305"></script><script src="bingo-delivery-customer-code.js?v=20260818-1"></script><script src="bingo-delivery-customer-rating.js?v=20260819-1"></script>
<script>(function(){'use strict';const qs=new URLSearchParams(location.search),delivery=qs.get('delivery')||'',store=qs.get('store')||'';const steps=['pending','ready','assigned','picked_up','on_delivery','delivered'];const copy={pending:['🧾','تم تأكيد طلبك','وصل طلبك إلى BINGO والمتجر يراجعه الآن.'],ready:['🛍️','المتجر يحضّر طلبك','سيبدأ BINGO باختيار أفضل مندوب متاح.'],assigned:['🛵','تم العثور على مندوب','المندوب يستعد لاستلام طلبك من المتجر.'],picked_up:['📦','تم استلام الطلب','المندوب استلم طلبك من المتجر.'],on_delivery:['🛵','طلبك في الطريق','المندوب متجه إليك الآن.'],delivered:['🎉','تم التوصيل','نتمنى أن تكون تجربة BINGO أعجبتك.']};function paint(status){const idx=Math.max(0,steps.indexOf(status));document.getElementById('track-stage').innerHTML=steps.map((_,i)=>'<span class="stage '+(i<=idx?'on':'')+'"></span>').join('');const c=copy[status]||copy.pending;document.getElementById('status-icon').textContent=c[0];document.getElementById('status-title').textContent=c[1];document.getElementById('status-text').textContent=c[2]}async function load(){const e=document.getElementById('track-error');e.innerHTML='';const user=await BingoAuth.getUser();if(!user){location.href='login.html?next='+encodeURIComponent(location.pathname+location.search);return}let q=sb.from('delivery_orders').select('id,order_number,status,total,delivery_fee,created_at').eq('customer_id',user.id).order('created_at',{ascending:false}).limit(1);if(delivery){if(/^[0-9a-f-]{36}$/i.test(delivery))q=sb.from('delivery_orders').select('id,order_number,status,total,delivery_fee,created_at').eq('customer_id',user.id).eq('id',delivery).limit(1);else q=sb.from('delivery_orders').select('id,order_number,status,total,delivery_fee,created_at').eq('customer_id',user.id).eq('order_number',delivery).limit(1)}const r=await q;if(r.error||!r.data?.length){e.innerHTML='<div class="notice err">تعذر العثور على طلب التوصيل.</div>';return}const o=r.data[0];document.getElementById('track-ref').textContent=(o.order_number||o.id)+(store?' · '+store:'')+' · '+Number(o.total||0).toFixed(3)+' OMR';paint(o.status);history.replaceState(null,'','order-tracking.html?delivery='+encodeURIComponent(o.order_number||o.id)+(store?'&store='+encodeURIComponent(store):''))}document.getElementById('refresh-track').onclick=load;load();setInterval(load,10000)})();</script></body></html>
