<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Payment</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><style>.pay-result{max-width:620px;margin:70px auto;padding:30px;text-align:center;border:1px solid #e4e8ef;border-radius:24px;background:#fff;box-shadow:0 15px 40px rgba(9,42,130,.09)}.pay-icon{font-size:54px}.pay-result h1{margin:12px 0}.pay-result p{color:#64748b;line-height:1.7}.pay-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a></div></header><main class="pay-result"><div class="pay-icon" id="icon">⏳</div><h1 id="title">Verifying payment…</h1><p id="text">Please wait while BINGO confirms your payment securely.</p><div class="pay-actions" id="actions"></div></main><script>
async function verify(){const id=new URLSearchParams(location.search).get('payment_id');const title=document.getElementById('title'),text=document.getElementById('text'),icon=document.getElementById('icon'),actions=document.getElementById('actions');if(!id){icon.textContent='⚠️';title.textContent='Payment reference missing';text.textContent='Return to the plans page and try again.';actions.innerHTML='<a class="btn primary" href="listing-plans.html">Back to plans</a>';return}try{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html?next='+encodeURIComponent(location.href);return}const {data,error}=await sb.functions.invoke('verify-republish-payment',{body:{payment_id:id}});if(error)throw error;if(data?.status==='paid'){icon.textContent='✅';title.textContent='Plan activated';text.textContent='Your BINGO Republish plan is active. You can now republish each published listing once every 24 hours.';actions.innerHTML='<a class="btn primary" href="dashboard.html#myListings">Go to My Ads</a><a class="btn" href="marketplace.html">Marketplace</a>'}else{icon.textContent='⏳';title.textContent='Payment not confirmed yet';text.textContent='Current payment status: '+(data?.status||'pending')+'. If you just paid, wait a few seconds and try again.';actions.innerHTML='<button class="btn primary" onclick="location.reload()">Check again</button><a class="btn" href="listing-plans.html">Back to plans</a>'}}catch(e){icon.textContent='⚠️';title.textContent='Could not verify payment';text.textContent=e?.message||String(e);actions.innerHTML='<button class="btn primary" onclick="location.reload()">Try again</button><a class="btn" href="listing-plans.html">Back to plans</a>'}}
verify();
</script></body></html>
