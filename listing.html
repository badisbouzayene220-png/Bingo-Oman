<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Listing</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="listing-upgrade.css?v=20260819-2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><script src="language.js"></script><link rel="stylesheet" href="characters.css"><link rel="stylesheet" href="global-banner.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><button class="hamb" onclick="document.querySelector('.navlinks').classList.toggle('open')">☰</button><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><div class="actions"></div></div></header><main class="pagebody"><div class="container"><a class="listing-back" href="marketplace.html">← Back to Marketplace</a><div id="detail">Loading…</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let currentListing=null,currentUser=null,favoriteRemoteAvailable=true;
function vehicleDetails(a){if(!a||a.vehicle_type!=='car')return'';const labels={automatic:'Automatic',manual:'Manual',cvt:'CVT',petrol:'Petrol',diesel:'Diesel',hybrid:'Hybrid',electric:'Electric',comprehensive:'Comprehensive insurance',third_party:'Third-party insurance',expired:'No / expired insurance',sedan:'Sedan',suv:'SUV',hatchback:'Hatchback',pickup:'Pickup',coupe:'Coupe',van:'Van'};const item=(icon,label,value)=>value?`<span>${icon} ${label}: ${esc(labels[value]||value)}</span>`:'';return `<div class="detail-meta">${item('🛣️','Mileage',a.mileage_km?Number(a.mileage_km).toLocaleString()+' km':'')}${item('⚙️','Transmission',a.transmission)}${item('⛽','Fuel',a.fuel_type)}${item('🛡️','Insurance',a.insurance_type)}${item('📅','Insurance expiry',a.insurance_expiry)}${item('🚙','Body',a.body_type)}${a.color?`<span>${a.color_hex?`<i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${esc(a.color_hex)};border:1px solid #bbb;vertical-align:-1px;margin-right:4px"></i>`:'🎨 '}Color: ${esc(a.color)}</span>`:''}</div>`}
(async()=>{currentUser=await BingoAuth.getUser();const id=new URLSearchParams(location.search).get('id');if(!id){location.href='marketplace.html';return}const {data,error}=await sb.from('listings').select('*,categories(name_en,name_ar),listing_images(image_url,sort_order)').eq('id',id).single();if(error){document.getElementById('detail').innerHTML='<div class="panel">'+esc(error.message)+'</div>';return}currentListing=data;const imgs=(data.listing_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));document.title=esc(data.title)+' | BINGO Oman';document.getElementById('detail').innerHTML=`<div class="listing-detail"><div class="gallery"><div class="main-image">${imgs[0]?`<img id="mainImg" src="${esc(imgs[0].image_url)}" alt="${esc(data.title)}">`:'📦'}</div><div class="thumbs">${imgs.map((x,i)=>`<img class="${i===0?'active':''}" src="${esc(x.image_url)}" alt="" onclick="selectImage(this)">`).join('')}</div></div><div class="panel detail-info"><div class="kicker">${esc(data.categories?.name_en||'Marketplace')}</div><h1>${esc(data.title)}</h1><div class="price big">${Number(data.price||0).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><div class="meta"><span>📍 ${esc(data.city||'Oman')}</span>${data.condition?`<span>✓ ${esc(data.condition)}</span>`:''}</div><p class="detail-description">${esc(data.description||'')}</p>${data.attributes?`<div class="detail-meta">${data.attributes.brand?`<span>🏷️ ${esc(data.attributes.brand)}</span>`:''}${data.attributes.model?`<span>Model: ${esc(data.attributes.model)}</span>`:''}${data.attributes.year?`<span>Year: ${esc(data.attributes.year)}</span>`:''}${data.attributes.details?`<span>${esc(data.attributes.details)}</span>`:''}</div>${vehicleDetails(data.attributes)}`:''}${data.latitude&&data.longitude?`<a class="btn outline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.latitude+','+data.longitude)}">📍 View item location</a>`:''}<div class="listing-actions"><button class="btn primary" onclick="contactSeller()">💬 Contact seller</button><button id="favoriteBtn" class="btn outline favorite-btn" type="button" onclick="toggleFavorite()" aria-label="Favorite">♡</button></div></div></div>`;await syncFavorite();})();
function selectImage(el){const main=document.getElementById('mainImg');if(main)main.src=el.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('active',x===el));}
function localFavoriteIds(){try{return JSON.parse(localStorage.getItem('bingoFavorites')||'[]')}catch{return[]}}
function setLocalFavorite(id,active){let ids=localFavoriteIds();ids=active?[...new Set([...ids,id])]:ids.filter(x=>x!==id);localStorage.setItem('bingoFavorites',JSON.stringify(ids));}
async function isFavorite(id){if(currentUser&&favoriteRemoteAvailable){const {data,error}=await sb.from('user_favorites').select('listing_id').eq('user_id',currentUser.id).eq('listing_id',id).maybeSingle();if(!error)return!!data;favoriteRemoteAvailable=false;console.warn('Favorites table unavailable; using local fallback:',error.message)}return localFavoriteIds().includes(id)}
async function syncFavorite(){const id=new URLSearchParams(location.search).get('id'),btn=document.getElementById('favoriteBtn');if(!btn)return;const active=await isFavorite(id);btn.classList.toggle('active',active);btn.textContent=active?'♥':'♡';btn.title=active?'Remove from favorites':'Save to favorites';}
async function toggleFavorite(){const id=new URLSearchParams(location.search).get('id'),btn=document.getElementById('favoriteBtn');if(!id||!btn)return;btn.disabled=true;const active=btn.classList.contains('active');if(currentUser&&favoriteRemoteAvailable){let result;if(active)result=await sb.from('user_favorites').delete().eq('user_id',currentUser.id).eq('listing_id',id);else result=await sb.from('user_favorites').insert({user_id:currentUser.id,listing_id:id});if(result.error){favoriteRemoteAvailable=false;console.warn('Favorites table unavailable; using local fallback:',result.error.message);setLocalFavorite(id,!active)}else{setLocalFavorite(id,!active)}}else{setLocalFavorite(id,!active)}btn.disabled=false;await syncFavorite();}
async function contactSeller(){const u=currentUser||await BingoAuth.getUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const id=new URLSearchParams(location.search).get('id');if(!id){alert('Listing not found.');return}const listing=currentListing||((await sb.from('listings').select('id,user_id,title').eq('id',id).single()).data);if(!listing){alert('Could not load the seller information.');return}if(listing.user_id===u.id){alert('You cannot message yourself.');return}const {data:existing,error:findError}=await sb.from('conversations').select('id').eq('listing_id',listing.id).eq('buyer_id',u.id).eq('seller_id',listing.user_id).maybeSingle();if(findError){alert('Could not open the conversation: '+findError.message);return}let conversationId=existing?.id;if(!conversationId){const {data:created,error:createError}=await sb.from('conversations').insert({listing_id:listing.id,buyer_id:u.id,seller_id:listing.user_id}).select('id').single();if(createError){alert('Could not start the conversation: '+createError.message);return}conversationId=created.id}location.href='messages.html?conversation='+encodeURIComponent(conversationId)}
</script><script src="characters.js"></script></body></html>
