<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Listing</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script src="language.js"></script></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><div class="actions"></div></div></header><main class="pagebody"><div class="container" id="detail">Loading…</div></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='marketplace.html';return}const {data,error}=await sb.from('listings').select('*,categories(name_en,name_ar),listing_images(image_url,sort_order)').eq('id',id).single();if(error){document.getElementById('detail').textContent=error.message;return}const imgs=(data.listing_images||[]).sort((a,b)=>a.sort_order-b.sort_order);document.getElementById('detail').innerHTML=`<div class="listing-detail"><div class="gallery"><div class="main-image">${imgs[0]?`<img id="mainImg" src="${imgs[0].image_url}" alt="">`:'📦'}</div><div class="thumbs">${imgs.map(x=>`<img src="${x.image_url}" onclick="document.getElementById('mainImg').src=this.src">`).join('')}</div></div><div class="panel detail-info"><div class="kicker">${data.categories?.name_en||'Marketplace'}</div><h1>${esc(data.title)}</h1><div class="price big">${Number(data.price||0).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><div class="meta"><span>📍 ${esc(data.city||'Oman')}</span><span>${esc(data.condition||'')}</span></div><p>${esc(data.description||'')}</p><button class="btn primary" onclick="contactSeller()">Contact seller</button></div></div>`})();function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function contactSeller(){const u=await BingoAuth.getUser();if(!u){location.href='login.html';return}alert('Messaging will be connected to conversations in the next step.');}
</script></body></html>
