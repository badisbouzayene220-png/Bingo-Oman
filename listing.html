<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | Listing</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><link rel="stylesheet" href="listing-upgrade.css?v=20260819-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><script src="language.js"></script><link rel="stylesheet" href="characters.css"><link rel="stylesheet" href="global-banner.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html"><img src="logo-en.png" alt="BINGO Oman"></a><button class="hamb" onclick="document.querySelector('.navlinks').classList.toggle('open')">☰</button><nav class="navlinks"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="auctions.html">Auctions</a><a href="tenders.html">Tenders</a></nav><div class="actions"></div></div></header><main class="pagebody"><div class="container"><a class="listing-back" href="marketplace.html">← Back to Marketplace</a><div id="detail">Loading…</div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let currentListing=null;
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){location.href='marketplace.html';return}const {data,error}=await sb.from('listings').select('*,categories(name_en,name_ar),listing_images(image_url,sort_order)').eq('id',id).single();if(error){document.getElementById('detail').innerHTML='<div class="panel">'+esc(error.message)+'</div>';return}currentListing=data;const imgs=(data.listing_images||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));document.title=esc(data.title)+' | BINGO Oman';document.getElementById('detail').innerHTML=`<div class="listing-detail"><div class="gallery"><div class="main-image">${imgs[0]?`<img id="mainImg" src="${esc(imgs[0].image_url)}" alt="${esc(data.title)}">`:'📦'}</div><div class="thumbs">${imgs.map((x,i)=>`<img class="${i===0?'active':''}" src="${esc(x.image_url)}" alt="" onclick="selectImage(this)">`).join('')}</div></div><div class="panel detail-info"><div class="kicker">${esc(data.categories?.name_en||'Marketplace')}</div><h1>${esc(data.title)}</h1><div class="price big">${Number(data.price||0).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><div class="meta"><span>📍 ${esc(data.city||'Oman')}</span>${data.condition?`<span>✓ ${esc(data.condition)}</span>`:''}</div><p class="detail-description">${esc(data.description||'')}</p>${data.attributes?`<div class="detail-meta">${data.attributes.brand?`<span>🏷️ ${esc(data.attributes.brand)}</span>`:''}${data.attributes.model?`<span>Model: ${esc(data.attributes.model)}</span>`:''}${data.attributes.year?`<span>Year: ${esc(data.attributes.year)}</span>`:''}${data.attributes.details?`<span>${esc(data.attributes.details)}</span>`:''}</div>`:''}${data.latitude&&data.longitude?`<a class="btn outline" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.latitude+','+data.longitude)}">📍 View item location</a>`:''}<div class="listing-actions"><button class="btn primary" onclick="contactSeller()">💬 Contact seller</button><button id="favoriteBtn" class="btn outline favorite-btn" type="button" onclick="toggleFavorite()" aria-label="Favorite">♡</button></div></div></div>`;syncFavorite();})();
function selectImage(el){const main=document.getElementById('mainImg');if(main)main.src=el.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.toggle('active',x===el));}
function favoriteIds(){try{return JSON.parse(localStorage.getItem('bingoFavorites')||'[]')}catch{return[]}}
function syncFavorite(){const id=new URLSearchParams(location.search).get('id'),btn=document.getElementById('favoriteBtn');if(!btn)return;const active=favoriteIds().includes(id);btn.classList.toggle('active',active);btn.textContent=active?'♥':'♡';}
function toggleFavorite(){const id=new URLSearchParams(location.search).get('id');let ids=favoriteIds();ids=ids.includes(id)?ids.filter(x=>x!==id):[...ids,id];localStorage.setItem('bingoFavorites',JSON.stringify(ids));syncFavorite();}
async function contactSeller(){const u=await BingoAuth.getUser();if(!u){location.href='login.html?next='+encodeURIComponent(location.href);return}const id=new URLSearchParams(location.search).get('id');if(!id){alert('Listing not found.');return}const listing=currentListing||((await sb.from('listings').select('id,user_id,title').eq('id',id).single()).data);if(!listing){alert('Could not load the seller information.');return}if(listing.user_id===u.id){alert('You cannot message yourself.');return}const {data:existing,error:findError}=await sb.from('conversations').select('id').eq('listing_id',listing.id).eq('buyer_id',u.id).eq('seller_id',listing.user_id).maybeSingle();if(findError){alert('Could not open the conversation: '+findError.message);return}let conversationId=existing?.id;if(!conversationId){const {data:created,error:createError}=await sb.from('conversations').insert({listing_id:listing.id,buyer_id:u.id,seller_id:listing.user_id}).select('id').single();if(createError){alert('Could not start the conversation: '+createError.message);return}conversationId=created.id}location.href='messages.html?conversation='+encodeURIComponent(conversationId)}
</script><script src="characters.js"></script></body></html>
