<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | My Orders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><style>.orders{padding:35px 0}.order{background:#fff;border:1px solid #e2e7ee;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 26px rgba(10,35,80,.05)}.orderhead{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{padding:6px 11px;border-radius:999px;background:#eef3ff;color:#092a82;font-size:12px;font-weight:800}.status.live{background:#fff2df;color:#a65300}.status.done{background:#e9f8ef;color:#147a3d}.items{margin-top:14px;border-top:1px solid #edf0f4;padding-top:10px}.item{display:flex;justify-content:space-between;padding:7px 0}.total{font-weight:900;color:#092a82;font-size:18px}.journey{display:flex;gap:5px;margin:14px 0 5px}.journey i{height:6px;flex:1;border-radius:20px;background:#e8edf4}.journey i.on{background:#f28c18}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.delivery-note{font-size:13px;opacity:.75;margin-top:7px}</style><link rel="stylesheet" href="characters.css"><link rel="stylesheet" href="global-banner.css"></head><body><header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a id="ordersStoreLink" href="store.html">Store</a><a id="ordersNavTitle" class="active" href="orders.html">My Orders</a></nav><div class="actions"><a id="ordersShopButton" class="btn primary small" href="store.html">Shop</a></div></div></header><main class="pagebody"><div class="container orders"><h1 id="ordersTitle">My Orders</h1><p id="ordersIntro">BINGO store and delivery orders in one place.</p><div id="msg"></div><div id="list">Loading…</div></div></main><script>
const $=id=>document.getElementById(id),isAr=()=>((localStorage.getItem('bingo-language')||localStorage.getItem('bingo-lang')||document.documentElement.lang||'en')==='ar'),t=(en,ar)=>isAr()?ar:en,esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),steps=['pending','confirmed','preparing','ready','assigned','picked_up','on_delivery','delivered'];const statusText=s=>(isAr()?{pending:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التحضير',ready:'جاهز للاستلام',assigned:'تم تعيين المندوب',picked_up:'استلم المندوب الطلب',on_delivery:'في الطريق إليك',delivered:'تم التوصيل',cancelled:'ملغي'}:{pending:'Order received',confirmed:'Order confirmed',preparing:'Preparing',ready:'Ready for pickup',assigned:'Driver assigned',picked_up:'Picked up',on_delivery:'On the way',delivered:'Delivered',cancelled:'Cancelled'})[s]||s||t('Processing','قيد المعالجة');function renderStatic(){$('ordersStoreLink').textContent=t('Store','المتجر');$('ordersNavTitle').textContent=t('My Orders','طلباتي');$('ordersShopButton').textContent=t('Shop','تسوق');$('ordersTitle').textContent=t('My Orders','طلباتي');$('ordersIntro').textContent=t('BINGO store and delivery orders in one place.','طلبات متجر BINGO والتوصيل في مكان واحد.');$('list').textContent=t('Loading…','جارٍ التحميل…')}let ordersLanguage=isAr()?'ar':'en';document.addEventListener('bingo-language-changed',e=>{const next=e.detail?.language||'en';if(next!==ordersLanguage){ordersLanguage=next;location.reload()}});function bars(s){const n=Math.max(0,steps.indexOf(s));return '<div class="journey">'+steps.map((_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div>'}function timeout(p,ms=8000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}async function load(){const list=$('list');try{const u=await timeout(BingoAuth.getUser(),5000);if(!u){list.innerHTML='<div class="empty"><h3>'+t('Please log in','يرجى تسجيل الدخول')+'</h3><a class="btn primary" href="login.html?next=orders.html">'+t('Login','تسجيل الدخول')+'</a></div>';return}const ordersRes=await timeout(sb.rpc('my_store_orders'),8000);if(ordersRes.error)throw ordersRes.error;const arr=ordersRes.data||[];if(!arr.length){list.innerHTML='<div class="empty"><h3>'+t('No orders yet','لا توجد طلبات بعد')+'</h3><a href="store.html">'+t('Start shopping','ابدأ التسوق')+'</a></div>';return}let deliveries=[];try{const dr=await timeout(sb.from('delivery_orders').select('id,order_number,status,created_at,notes').eq('customer_id',u.id).order('created_at',{ascending:false}).limit(100),8000);if(!dr.error)deliveries=dr.data||[]}catch(e){console.warn('Delivery lookup skipped:',e)}list.innerHTML='';for(const o of arr){const marker='BINGO Store Order '+o.order_number;const created=new Date(o.created_at).getTime();const d=deliveries.find(x=>String(x.notes||'').includes(marker))||deliveries.find(x=>Math.abs(new Date(x.created_at).getTime()-created)<120000)||null;const st=d?.status||o.status||'pending',live=!['delivered','cancelled'].includes(st);const a=document.createElement('article');a.className='order';a.innerHTML=`<div class="orderhead"><div><b>${esc(o.order_number)}</b><div>${new Date(o.created_at).toLocaleString(isAr()?'ar-OM':'en-OM')}</div></div><span class="status ${st==='delivered'?'done':live?'live':''}">${esc(statusText(st))}</span></div>${bars(st)}<div class="delivery-note">${d?t('🛵 BINGO Delivery · ','🛵 توصيل BINGO · ')+esc(d.order_number||''):t('🛍️ BINGO Order','🛍️ طلب BINGO')}</div><div class="items" id="i-${o.id}">${t('Loading items…','جارٍ تحميل المنتجات…')}</div><div class="total">${t('Total','الإجمالي')}: ${Number(o.total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><div class="order-actions">${d?`<a class="btn primary small" href="order-tracking.html?delivery=${encodeURIComponent(d.order_number||d.id)}&store=${encodeURIComponent(o.order_number)}">${live?t('Track order','تتبع الطلب'):t('View delivery details','عرض تفاصيل التوصيل')}</a>`:''}<a class="btn small" href="store.html">${t('Shop again','تسوق مرة أخرى')}</a></div>`;list.appendChild(a);try{const ir=await timeout(sb.rpc('my_store_order_items',{p_order_id:o.id}),6000);const box=$('i-'+o.id);if(box)box.innerHTML=ir.error?'<small>'+t('Could not load items','تعذر تحميل المنتجات')+'</small>':(ir.data||[]).map(x=>`<div class="item"><span>${esc(x.product_title)} × ${x.quantity}</span><b>${Number(x.line_total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</b></div>`).join('')}catch(e){const box=$('i-'+o.id);if(box)box.innerHTML='<small>'+t('Could not load items','تعذر تحميل المنتجات')+'</small>'}}}catch(e){console.error('My Orders:',e);list.innerHTML='<div class="notice err">'+t('Could not load orders now.','تعذر تحميل الطلبات الآن.')+' <button class="btn small" onclick="location.reload()">'+t('Try again','إعادة المحاولة')+'</button><br><small>'+esc(e?.message||e)+'</small></div>'}}renderStatic();load();
</script><script src="bingo-orders-groups.js?v=20260820-1"></script><script src="language.js"></script><script src="characters.js"></script></body></html>
