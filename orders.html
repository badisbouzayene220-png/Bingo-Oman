<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | My Orders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="global-banner.js" defer></script><script src="auth.js"></script><style>.orders{padding:35px 0}.order{background:#fff;border:1px solid #e2e7ee;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 26px rgba(10,35,80,.05)}.orderhead{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{padding:6px 11px;border-radius:999px;background:#eef3ff;color:#092a82;font-size:12px;font-weight:800}.status.live{background:#fff2df;color:#a65300}.status.done{background:#e9f8ef;color:#147a3d}.items{margin-top:14px;border-top:1px solid #edf0f4;padding-top:10px}.item{display:flex;justify-content:space-between;padding:7px 0}.total{font-weight:900;color:#092a82;font-size:18px}.journey{display:flex;gap:5px;margin:14px 0 5px}.journey i{height:6px;flex:1;border-radius:20px;background:#e8edf4}.journey i.on{background:#f28c18}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.delivery-note{font-size:13px;opacity:.75;margin-top:7px}</style><link rel="stylesheet" href="characters.css"><link rel="stylesheet" href="global-banner.css"></head><body><header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a href="store.html">Store</a><a class="active" href="orders.html">My Orders</a></nav><div class="actions"><a class="btn primary small" href="store.html">Shop</a></div></div></header><main class="pagebody"><div class="container orders"><h1>My Orders</h1><p>طلبات BINGO والتوصيل في مكان واحد.</p><div id="msg"></div><div id="list">Loading…</div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),steps=['pending','ready','assigned','picked_up','on_delivery','delivered'];const statusText=s=>({pending:'تم تأكيد الطلب',ready:'جاري التحضير',assigned:'تم تعيين المندوب',picked_up:'استلم المندوب الطلب',on_delivery:'في الطريق إليك',delivered:'تم التوصيل',cancelled:'ملغي'}[s]||s||'قيد المعالجة');function bars(s){const n=Math.max(0,steps.indexOf(s));return '<div class="journey">'+steps.map((_,i)=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div>'}async function deliveryFor(order){try{let q=sb.from('delivery_orders').select('id,order_number,status,created_at').eq('customer_id',(await BingoAuth.getUser()).id).order('created_at',{ascending:false}).limit(20);const r=await q;if(r.error)return null;const created=new Date(order.created_at).getTime();return (r.data||[]).find(d=>Math.abs(new Date(d.created_at).getTime()-created)<120000)||null}catch(e){return null}}async function load(){const u=await BingoAuth.getUser();if(!u){$('list').innerHTML='<div class="empty"><h3>Please log in</h3><a class="btn primary" href="login.html?next=orders.html">Login</a></div>';return}const {data,error}=await sb.rpc('my_store_orders');if(error){$('list').innerHTML='<div class="notice err">'+esc(error.message)+'</div>';return}let arr=data||[];if(!arr.length){$('list').innerHTML='<div class="empty"><h3>No orders yet</h3><a href="store.html">Start shopping</a></div>';return}$('list').innerHTML='';for(const o of arr){const d=await deliveryFor(o),st=d?.status||o.status||'pending',live=!['delivered','cancelled'].includes(st);const a=document.createElement('article');a.className='order';a.innerHTML=`<div class="orderhead"><div><b>${esc(o.order_number)}</b><div>${new Date(o.created_at).toLocaleString()}</div></div><span class="status ${st==='delivered'?'done':live?'live':''}">${esc(statusText(st))}</span></div>${bars(st)}<div class="delivery-note">${d?'🛵 BINGO Delivery · '+esc(d.order_number||''):'🛍️ BINGO Order'}</div><div class="items" id="i-${o.id}">Loading items…</div><div class="total">Total: ${Number(o.total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div><div class="order-actions">${d?`<a class="btn primary small" href="order-tracking.html?delivery=${encodeURIComponent(d.order_number||d.id)}&store=${encodeURIComponent(o.order_number)}">${live?'تتبع الطلب':'عرض تفاصيل التوصيل'}</a>`:''}<a class="btn small" href="store.html">تسوق مرة أخرى</a></div>`;$('list').appendChild(a);const {data:it}=await sb.rpc('my_store_order_items',{p_order_id:o.id});const box=$('i-'+o.id);if(box)box.innerHTML=(it||[]).map(x=>`<div class="item"><span>${esc(x.product_title)} × ${x.quantity}</span><b>${Number(x.line_total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</b></div>`).join('')}}}load();
</script><script src="language.js"></script><script src="characters.js"></script></body></html>
