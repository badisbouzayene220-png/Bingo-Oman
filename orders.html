<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO Oman | My Orders</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="logo.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><style>.orders{padding:35px 0}.order{background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:20px;margin:14px 0}.orderhead{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{padding:5px 10px;border-radius:999px;background:#eef3ff;color:#092a82;font-size:12px;font-weight:800}.items{margin-top:14px;border-top:1px solid #edf0f4;padding-top:10px}.item{display:flex;justify-content:space-between;padding:7px 0}.total{font-weight:900;color:#092a82;font-size:18px}</style></head><body><header class="header"><div class="container nav"><a class="main-logo" href="index.html"><img src="logo-en.png" class="logo-image"></a><nav class="navlinks"><a href="store.html">Store</a><a class="active" href="orders.html">My Orders</a></nav><div class="actions"><a class="btn primary small" href="store.html">Shop</a></div></div></header><main class="pagebody"><div class="container orders"><h1>My Orders</h1><div id="msg"></div><div id="list">Loading…</div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const u=await BingoAuth.getUser();if(!u){$('list').innerHTML='<div class="empty"><h3>Please log in</h3><a class="btn primary" href="login.html?next=orders.html">Login</a></div>';return}const {data,error}=await sb.rpc('my_store_orders');if(error){$('list').innerHTML='<div class="notice err">'+esc(error.message)+'</div>';return}if(new URLSearchParams(location.search).get('success'))$('msg').innerHTML='<div class="notice ok">Order '+esc(new URLSearchParams(location.search).get('success'))+' was placed successfully.</div>';let arr=data||[];$('list').innerHTML=arr.length?arr.map(o=>`<article class="order"><div class="orderhead"><div><b>${esc(o.order_number)}</b><div>${new Date(o.created_at).toLocaleString()}</div></div><span class="status">${esc(o.status)}</span></div><div class="items" id="i-${o.id}">Loading items…</div><div class="total">Total: ${Number(o.total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</div></article>`).join(''):'<div class="empty"><h3>No orders yet</h3><a href="store.html">Start shopping</a></div>';for(const o of arr){const {data:it}=await sb.rpc('my_store_order_items',{p_order_id:o.id});const box=$('i-'+o.id);if(box)box.innerHTML=(it||[]).map(x=>`<div class="item"><span>${esc(x.product_title)} × ${x.quantity}</span><b>${Number(x.line_total).toLocaleString('en-OM',{minimumFractionDigits:3})} OMR</b></div>`).join('')}}load();
</script></body></html>
